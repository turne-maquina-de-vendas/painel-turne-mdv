<title>QG Ruptura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: andar corporativo em 3D ocupando a tela; vidro fosco clínico nos controles (marca no topo, barra do fluxo embaixo, ficha da mesa à direita / bottom sheet no celular) */
:root{
  --void:#060a18;            /* céu da noite */
  --glass:rgba(13,14,19,.72);
  --glass-solid:#121318;
  --panel:#181a20;
  --ink:#f4efe8;  --ink2:#9b958e;  --line:rgba(255,255,255,.1);
  --lumon:#ff4423;           /* cor da marca */
  --signal:#ff7a5c;          /* neon */
  --onair:#ff4423;
  --serif:"Instrument Serif", Georgia, serif;
  --sans:"Geist", "SF Pro Text", system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#cena{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cena.arrastando{cursor:grabbing}
#cena.sobre{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lumon);outline-offset:2px}
.vidro{background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 18px 50px rgba(5,12,8,.28)}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.marca{border-radius:14px;padding:12px 16px 11px;display:flex;align-items:center;gap:12px}
.selo{width:30px;height:30px;border-radius:50%;background:var(--lumon);display:grid;place-items:center;flex:none}
.selo::after{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--signal);box-shadow:0 0 10px var(--signal)}
.marca h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.arroba{background:none;border:0;padding:0;font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:left;margin-top:2px}
.arroba:hover{color:var(--ink)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--glass-solid);padding:10px 15px;border-radius:11px;font-weight:500;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:#fff}
.btn.prim{background:var(--lumon);border-color:var(--lumon);color:#f3f6f2}
.btn.prim:hover{background:#174d38}
.hud .btn{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:var(--glass)}
.hud .btn.prim{background:var(--lumon)}
.btn.min{padding:7px 11px;font-size:12px;border-radius:9px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}

.fluxo{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:4;pointer-events:none}
.fluxo>*{pointer-events:auto}
.fluxo ol{list-style:none;margin:0;padding:5px;display:flex;gap:2px;border-radius:14px;overflow-x:auto;max-width:100%;min-width:0}
.fluxo li{display:flex;align-items:center}
.fluxo li+li::before{content:"";width:14px;height:1px;background:var(--ink2);opacity:.4;margin:0 2px}
.etapa{background:none;border:0;border-radius:10px;padding:7px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.etapa:hover,.etapa.ativa{background:rgba(29,92,67,.1)}
.etapa small{font-size:11px;color:var(--ink2)}
.etapa strong{font-size:13.5px;font-weight:500;white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.etapa strong i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--lumon);font-variant-numeric:tabular-nums}
.chip-ass{border-radius:14px;border:0;padding:0 16px;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;flex:none}
.chip-ass .ponto{width:8px;height:8px;border-radius:50%;background:#9aa69f}
.chip-ass.cobrando .ponto{background:var(--signal);box-shadow:0 0 0 0 rgba(63,224,176,.6);animation:pulsa 1.8s infinite}
.chip-ass small{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
@keyframes pulsa{70%{box-shadow:0 0 0 9px rgba(63,224,176,0)}100%{box-shadow:0 0 0 0 rgba(63,224,176,0)}}

.gaveta{position:fixed;top:calc(env(safe-area-inset-top,0px) + 82px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:min(410px,calc(100% - 32px));border-radius:18px;z-index:6;display:flex;flex-direction:column;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.gaveta.fechada{transform:translateX(24px);opacity:0;pointer-events:none}
.gav-topo{padding:18px 18px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.gav-topo>div{flex:1;min-width:0}
.olho{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.olho::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--lumon))}
.gav-topo h2{margin:0 0 6px;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.gav-topo p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.5}
.x{background:rgba(15,29,22,.06);border:0;border-radius:9px;width:32px;height:32px;font-size:14px;flex:none}
.x:hover{background:rgba(15,29,22,.12)}
.gav-corpo{overflow-y:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.secao{display:flex;flex-direction:column;gap:9px}
.secao h3{margin:0;font-size:13px;font-weight:500;color:var(--ink2)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:9px}
.card .linha{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card h4{margin:0;font-size:15px;font-weight:500;line-height:1.35;flex:1;min-width:0}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(15,29,22,.05);color:var(--ink2)}
.pill.fmt{background:rgba(29,92,67,.1);color:var(--lumon)}
.pill.ex{background:none;border:1px dashed var(--line)}
.card p{margin:0;font-size:13px;color:var(--ink2);line-height:1.45}
.bts{display:flex;gap:6px;flex-wrap:wrap}
.card label[for^="v-"]{max-width:140px}
.card textarea,.ciclo textarea{width:100%;box-sizing:border-box;font-size:13px}
.vazio{border:1px dashed rgba(15,29,22,.2);border-radius:12px;padding:16px;color:var(--ink2);font-size:13px;line-height:1.5}
.skill{font-family:var(--mono);font-size:12px;color:var(--ink2);margin:0;line-height:1.5}
.pill.serie{background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc)}
.series-lista{display:flex;flex-direction:column;gap:8px}
.serie-l{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.45}
.serie-l .topo{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.serie-l b{font-weight:600}
.serie-l .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.serie-l .trilho{height:6px;border-radius:3px;background:rgba(15,29,22,.07);position:relative;overflow:hidden}
.serie-l .trilho i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--sc)}
.serie-l .trilho em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.serie-l small{color:var(--ink2)}
.lista-dna{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.45}
.bio{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13px;line-height:1.5;white-space:pre-line}
.tab-skills{width:100%;border-collapse:collapse;font-size:12px}
.tab-skills td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tab-skills td:first-child{font-weight:500;white-space:nowrap;padding-right:10px}
.tab-skills code{font-family:var(--mono);font-size:11.5px}
.skill code{color:var(--ink);background:rgba(15,29,22,.06);padding:1px 5px;border-radius:4px}
.zapmsg{background:#0f1d16;color:#d6f5ea;border-radius:14px 14px 14px 4px;padding:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;border:1px solid rgba(63,224,176,.25)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.kpi small{display:block;font-size:11.5px;color:var(--ink2)}
.kpi strong{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
textarea.fallback{width:100%;min-height:90px;font-family:var(--mono);font-size:12px}

.modal{position:fixed;inset:0;background:rgba(6,12,9,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:10;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal form{border-radius:18px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:13px;background:var(--glass-solid)}
.modal h2{margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:500}
input,select,textarea{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;font-size:14px}
.modal .bts{justify-content:flex-end}
.md{white-space:normal!important;font-size:13px;line-height:1.55;color:var(--ink)}
.md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}
.md h5{margin:12px 0 4px;font-size:12.5px;font-weight:600}.md h5:first-child{margin-top:0}
.md ul{margin:0 0 8px;padding-left:18px}.md li{margin-bottom:4px}
.md code{font-family:var(--mono);font-size:11.5px}
.rot{display:flex;flex-direction:column;gap:10px}
.rot-topo{display:flex;flex-wrap:wrap;gap:6px}
.rot-abas{display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.05)}
.rot-abas button{flex:1;min-height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;cursor:pointer;padding:0 4px}
.rot-abas button[aria-selected="true"]{background:rgba(255,255,255,.12);color:var(--ink);font-weight:500}
.rot-abas button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.mock{width:100%;border-radius:8px;display:block}
.rot-aviso{font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:9px;background:rgba(232,162,58,.12);border:1px solid rgba(232,162,58,.35);color:var(--ink)}
.rot-aviso button{all:unset;cursor:pointer;text-decoration:underline;color:inherit}
.falas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.falas li{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.falas li:first-child{border-top:0;padding-top:2px}
.falas time,.cena time{font-family:var(--mono);font-size:11px;color:var(--ink2);padding-top:3px}
.falas q{quotes:none;font-size:15px;line-height:1.4;color:var(--ink)}
.falas .semfala{font-size:12.5px;color:var(--ink2);font-style:italic}
.fase{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;margin:0 0 6px;color:var(--signal)}
.cena{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px}
.cena-topo{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.cena-topo time{padding:0;color:var(--ink);font-weight:500}
.cena-topo small{font-size:11px;color:var(--ink2)}
.cena q{quotes:none;font-size:14px;line-height:1.4}
.cena dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:5px 8px;font-size:12.5px;line-height:1.45}
.cena dt{color:var(--ink2)}.cena dd{margin:0}
.rot-sec{border:1px solid var(--line);border-radius:10px;padding:10px}
.rot-sec-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.rot-sec h4{margin:0;font-size:13px;font-weight:600}
.agente-st{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:10px;border:1px solid var(--line);color:var(--ink)}
.agente-st .pulso{width:8px;height:8px;border-radius:50%;background:#1fae7a;animation:agpulso 1.2s ease-in-out infinite}
.agente-st.erro{border-color:#b3261e;color:inherit}
.agente-st.erro .pulso{background:#b3261e;animation:none}
@keyframes agpulso{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.agente-st .pulso{animation:none}}
.manual summary{cursor:pointer;font-size:12px;color:var(--ink2);padding:2px 0}
.manual[open] summary{margin-bottom:8px}
.modal .sub{margin:-4px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.modal .erro{margin:0;font-size:12.5px;color:#b3261e}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:var(--ink);color:#f3f6f2;padding:10px 15px;border-radius:11px;font-size:13px;z-index:12}
.dica{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);font-size:11.5px;color:rgba(243,246,242,.55);z-index:2;font-family:var(--mono)}

.pesq{border:1px solid var(--line);border-radius:10px;background:rgba(15,29,22,.025)}
.pesq summary{cursor:pointer;padding:8px 10px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.pesq div{padding:0 10px 10px;font-size:13px;line-height:1.5;white-space:pre-wrap;color:var(--ink)}
.dica-card{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.dica-card code{font-family:var(--mono);font-size:11.5px;background:rgba(15,29,22,.06);padding:1px 4px;border-radius:4px}
.passos{display:flex;flex-direction:column;gap:8px}
.passos p{margin:0;font-size:12.5px;color:var(--ink2)}
.ganchos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:g}
.gch{flex-direction:row;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink);font-weight:400}
.gch:hover{border-color:rgba(29,92,67,.4)}
.gch.on{border-color:var(--lumon);background:rgba(29,92,67,.07);box-shadow:0 0 0 1px var(--lumon) inset}
.gch input{margin-top:3px;accent-color:var(--lumon);padding:0}
.gch span{display:flex;flex-direction:column;gap:4px;min-width:0}
.gch b{font-weight:500;font-size:13.5px;line-height:1.4}
.gch i.pill{font-style:normal;align-self:flex-start}
.gch em{font-style:normal;font-size:12px;color:var(--ink2);line-height:1.4}
.escolhido{border-left:3px solid #e8a23a;padding:6px 0 6px 10px;font-size:14px;font-weight:500;line-height:1.4}
.escolhido small{display:block;font-size:11.5px;color:var(--ink2);font-weight:400}
.ciclo{background:rgba(127,108,242,.07);border:1px solid rgba(127,108,242,.25);border-radius:12px;padding:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.prompter{position:fixed;inset:0;z-index:20;background:#050806;color:#eef6f1;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-topo{display:flex;align-items:center;gap:10px;padding-block:calc(env(safe-area-inset-top,0px) + 16px) 12px;font-family:var(--mono);font-size:12.5px;color:rgba(238,246,241,.6)}
.p-topo #p-titulo{flex:1;min-width:0}
.p-topo .x{background:rgba(255,255,255,.1);color:#eef6f1}
.rec{width:10px;height:10px;border-radius:50%;background:var(--onair);box-shadow:0 0 12px var(--onair)}
.p-in{overflow-y:auto;max-width:900px;width:100%;margin:0 auto;padding-block:4vh 10vh}
.p-in small{font-family:var(--mono);font-size:13px;color:#e8a23a}
.p-in h2{margin:6px 0 4vh;font-size:clamp(28px,4.6vw,56px);font-weight:500;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
#p-roteiro .p-fala{margin:0 0 1.1em}#p-roteiro .p-fala small{display:block;font-family:var(--mono);font-size:13px;opacity:.55;margin-bottom:2px}
#p-roteiro{white-space:pre-wrap;font-size:clamp(20px,2.8vw,34px);line-height:1.5;color:rgba(238,246,241,.88)}
@media (max-width:900px){.dica{display:none}}
@media (max-width:700px){
  .marca{padding:10px 12px}
  .marca h1{font-size:14.5px}
  .btn{padding:9px 12px}
  #geral{display:none}
  .gaveta{top:auto;left:0;right:0;width:auto;bottom:0;height:70%;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .gaveta.fechada{transform:translateY(40px)}
  .etapa small{display:none}
  .fluxo{justify-content:flex-start;flex-direction:column;align-items:stretch}
  .chip-ass{padding:10px 14px;align-self:flex-start}
}
@media (prefers-reduced-motion:reduce){.chip-ass.cobrando .ponto{animation:none}.gaveta{transition:none}}
/* QG noturno: superfícies escuras e pílulas como no QG 3D */
.vidro{border:1px solid rgba(255,255,255,.08);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 50px rgba(0,0,0,.5)}
.marca h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:0}
.selo::after{border-color:#fff;box-shadow:0 0 10px var(--lumon)}
.btn{background:var(--glass-solid)}
.btn:hover{background:#1e2028}
.btn.prim:hover{background:#e63a1c}
.hud .btn[aria-pressed="true"]{border-color:var(--lumon);color:#fff}
.card,.serie-l,.bio,.kpi,input,select,textarea{background:var(--panel)}
.pill{background:rgba(255,255,255,.06)}
.pill.fmt{background:rgba(255,68,35,.14);color:#ff7a5c}
.x{background:rgba(255,255,255,.06)}.x:hover{background:rgba(255,255,255,.12)}
.etapa:hover,.etapa.ativa{background:rgba(255,68,35,.12)}
.etapa strong i{color:#ff7a5c}
.gch.on{background:rgba(255,68,35,.08)}
.pesq{background:rgba(255,255,255,.02)}
.skill code,.dica-card code{background:rgba(255,255,255,.08)}
.serie-l .trilho{background:rgba(255,255,255,.08)}
.serie-l .trilho em{background:#fff}
.vazio{border-color:rgba(255,255,255,.15)}
.modal{background:rgba(2,4,10,.6)}
.toast{background:#f4efe8;color:#111}
.gav-topo h2{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:0}
.legenda{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);text-align:center;z-index:4;pointer-events:none;width:min(560px,calc(100% - 32px));text-shadow:0 2px 20px rgba(0,0,0,.8)}
.legenda small{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ff7a5c}
.legenda h2{margin:4px 0 6px;font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,64px);line-height:1;color:#fff}

<canvas id="cena" aria-label="QG 3D da agência suspenso na Av. Paulista. Arraste para girar, role para aproximar, clique numa mesa para abrir."></canvas>

<header class="hud">
  <div class="marca vidro">
    <span class="selo" aria-hidden="true"></span>
    <div>
      <h1>QG Ruptura</h1>
      <button class="arroba" id="arroba" title="Trocar o @ e o nicho">@seuperfil</button>
    </div>
  </div>
  <div class="acoes">
    <button class="btn" id="pausa" aria-pressed="false" title="Pausar ou retomar o movimento do escritório">Pausar</button>
    <button class="btn" id="tour" aria-pressed="false">▶ Tour</button>
    <button class="btn" id="estrat">Estratégia</button>
    <button class="btn" id="geral">Visão do andar</button>
    <button class="btn prim" id="nova">Nova pauta</button>
  </div>
</header>

<nav class="fluxo" aria-label="Fluxo do conteúdo">
  <ol id="fluxo" class="vidro"></ol>
  <button class="chip-ass vidro" id="chip-ass"></button>
</nav>

<aside class="gaveta vidro fechada" id="gaveta" aria-live="polite">
  <div class="gav-topo">
    <div>
      <p class="olho" id="g-olho"></p>
      <h2 id="g-titulo"></h2>
      <p id="g-faz"></p>
    </div>
    <button class="x" id="g-fechar" aria-label="Fechar">✕</button>
  </div>
  <div class="gav-corpo" id="g-corpo"></div>
</aside>

<div class="modal" id="modal" hidden>
  <form id="form-pauta" class="vidro">
    <h2>Nova pauta</h2>
    <label for="f-titulo">Assunto<input id="f-titulo" required maxlength="120" placeholder="Ex.: Como seria o design do Chaves no Instagram?"></label>
    <label for="f-formato">Formato
      <select id="f-formato"><option>Reel</option><option>Carrossel</option><option>Stories</option></select>
    </label>
    <label for="f-serie">Série
      <select id="f-serie"></select>
    </label>
    <label for="f-nota">Pesquisa<textarea id="f-nota" rows="4" maxlength="2000" placeholder="Por que está quente, o que já deu resultado, o gap"></textarea></label>
    <div class="bts"><button type="button" class="btn" id="f-cancelar">Cancelar</button><button class="btn prim">Enviar ao Pesquisador</button></div>
  </form>
</div>

<div class="modal" id="modal-arroba" hidden>
  <form id="form-arroba" class="vidro">
    <h2>Seu perfil</h2>
    <label for="f-arroba">@ do Instagram<input id="f-arroba" maxlength="40" placeholder="seuperfil"></label>
    <label for="f-nicho">Nicho<input id="f-nicho" maxlength="80" placeholder="Ex.: branding descomplicado, identidade visual e arquétipos"></label>
    <div class="bts"><button type="button" class="btn" id="a-cancelar">Cancelar</button><button class="btn prim">Salvar</button></div>
  </form>
</div>

<div class="modal" id="modal-login" hidden>
  <form id="form-login" class="vidro">
    <h2>Entrar no QG</h2>
    <p class="sub">Com a senha, as pautas ficam guardadas no servidor e aparecem em qualquer navegador.</p>
    <label for="f-senha">Senha<input id="f-senha" type="password" autocomplete="current-password" required></label>
    <p class="erro" id="l-erro" role="alert" hidden></p>
    <div class="bts"><button type="button" class="btn" id="l-depois">Agora não</button><button class="btn prim" id="l-entrar">Entrar</button></div>
  </form>
</div>

<div class="prompter" id="prompter" hidden role="dialog" aria-label="Modo gravação">
  <div class="p-topo"><span class="rec"></span><span id="p-titulo"></span><button class="x" id="p-fechar" aria-label="Fechar modo gravação">✕</button></div>
  <div class="p-in"><small>Abre com</small><h2 id="p-gancho"></h2><div id="p-roteiro"></div></div>
</div>

<div class="legenda" id="legenda" hidden aria-live="polite"><small id="lg-olho"></small><h2 id="lg-nome"></h2><p id="lg-faz"></p></div>

<div class="toast" id="toast" hidden></div>

/* ---------- Nuvem (Netlify Functions + Blobs): localStorage fica como cópia offline ---------- */
const LS_NUVEM = 'agencia-nuvem-v1'; // { migrado, sujo } deste navegador
const nuvem = { on:false, chave:false, timer:null, enviando:false, deNovo:false, versao:0, tique:0, pedidos:new Set() };
const espera = ms => new Promise(r=>setTimeout(r,ms));
function nuvemMeta(m){ try{ if(m){ localStorage.setItem(LS_NUVEM, JSON.stringify(m)); return m; } return JSON.parse(localStorage.getItem(LS_NUVEM)) || {}; }catch(e){ return m || {}; } }
const nuvemMarca = campos => nuvemMeta(Object.assign(nuvemMeta(), campos));
function nuvemAgendar(){ nuvem.versao++; nuvemMarca({sujo:true}); if(!nuvem.on) return; clearTimeout(nuvem.timer); nuvem.timer = setTimeout(nuvemEnviar, 900); }
async function nuvemEnviar(){
  if(!nuvem.on) return;
  if(nuvem.enviando){ nuvem.deNovo = true; return; }
  nuvem.enviando = true;
  const versao = nuvem.versao;
  try{
    const corpo = JSON.stringify({estado:S, base:nuvemMeta().base||0});
    const r = await fetch('/api/estado', {method:'PUT', headers:{'Content-Type':'application/json'}, body:corpo, credentials:'same-origin', keepalive: corpo.length < 60000});
    if(r.status===401){ nuvem.on = false; pedirLogin(); }
    else if(r.ok){
      const j = await r.json();
      nuvemMarca({base:j.atualizadoEm});
      if(versao===nuvem.versao){ nuvemMarca({sujo:false}); if(j.estado){ S = j.estado; salvarLocal(); render(); } }
    }
  }catch(e){ /* sem rede: fica marcado como sujo e reenvia quando voltar */ }
  nuvem.enviando = false;
  if(nuvem.deNovo){ nuvem.deNovo = false; nuvemEnviar(); }
}
async function nuvemDescarregar(){ clearTimeout(nuvem.timer); if(nuvemMeta().sujo) await nuvemEnviar(); while(nuvem.enviando) await espera(100); }
// Junta o que estava só neste navegador com o que já está no servidor, sem perder pauta.
function juntar(srv, loc){
  const m = Object.assign({}, srv, {cards: srv.cards.slice()});
  if((!m.arroba || m.arroba==='seuperfil') && loc.arroba && loc.arroba!=='seuperfil') m.arroba = loc.arroba;
  if(!m.nicho && loc.nicho) m.nicho = loc.nicho;
  const ids = new Set(m.cards.map(c=>c.id));
  m.cards = loc.cards.filter(c=>!c.exemplo && !ids.has(c.id)).concat(m.cards);
  return m;
}
async function nuvemPuxar(primeira){
  let r;
  try{ r = await fetch('/api/estado', {credentials:'same-origin', cache:'no-store'}); }catch(e){ return; }
  if(r.status===401){ nuvem.on = false; pedirLogin(); return; }
  if(!r.ok) return;
  const {estado, atualizadoEm} = await r.json(); const meta = nuvemMeta();
  nuvem.on = true;
  if(primeira){ metricasPuxar(); try{ const a = await fetch('/api/agente', {credentials:'same-origin', cache:'no-store'}); if(a.ok) nuvem.chave = !!(await a.json()).chave; }catch(e){} }
  if(!estado || !Array.isArray(estado.cards)){ await nuvemEnviar(); if(primeira) toast('Pautas guardadas no servidor'); nuvemMarca({migrado:true}); }
  else if(!meta.migrado){
    const antes = S.cards.filter(c=>!c.exemplo).length;
    S = juntar(estado, S); S.atualizadoEm = Date.now(); salvarLocal(); nuvemMarca({base:atualizadoEm, migrado:true}); nuvem.versao++; await nuvemEnviar();
    if(antes) toast('Pautas deste navegador enviadas ao servidor');
  }
  else if(meta.sujo) await nuvemEnviar(); // o servidor mantém o que os agentes escreveram e devolve o resultado
  else if(atualizadoEm > (meta.base||0)){
    const rodando = S.cards.filter(c=>ocupado(c.agente));
    S = estado; salvarLocal(); nuvemMarca({base:atualizadoEm});
    const pronta = rodando.map(a=>S.cards.find(c=>c.id===a.id)).find(c=>c && !c.agente);
    if(pronta) toast(`Agentes terminaram: ${pronta.titulo}`);
    else if(!primeira && !rodando.length) toast('Pautas atualizadas');
  }
  else if(!primeira) return;
  render(); varrer();
}

const ocupado = a => !!a && a.status==='rodando' && Date.now()-a.em < 16*60000;
async function agenteChamar(corpo, marcar){
  await nuvemDescarregar();
  if(marcar){ marcar({status:'rodando', quem:({legenda:'social',design:'designer',plano:'estudio',edicao:'editor'})[corpo.so]||'roteirista', faz:'Na fila', em:Date.now()}); render(); }

    const r = await fetch('/api/agente', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo), credentials:'same-origin'});
    if(!r.ok && r.status!==409){ const j = await r.json().catch(()=>({})); toast(j.erro || 'Não consegui acordar o agente.'); }

/* ---------- Leitura do que vem do Claude ---------- */
const limpa = s => s.replace(/[*_`]/g,'').trim();
function lerPesquisa(txt){
  let itens = txt.split(/^#{2,3}\s+/m).slice(1).map(p=>{ const [t,...r] = p.split('\n'); return {titulo:limpa(t.replace(/^(assunto\s*)?\d+\s*[\.\):\-–]\s*/i,'')), pesquisa:r.join('\n').trim()}; });
  if(!itens.length) itens = txt.split('\n').filter(l=>/^\s*\d+[\.\)]\s+/.test(l)).map(l=>({titulo:limpa(l.replace(/^\s*\d+[\.\)]\s+/,'')), pesquisa:''}));
  const serieDoTexto = t => { const m = t.match(/s[ée]rie\s*:\s*(.+)/i); if(!m) return null; const v = m[1].toLowerCase(); const x = DNA.series.find(x=>v.includes(x.nome.toLowerCase())); return x ? x.id : null; };
  return itens.filter(i=>i.titulo).map(i=>({...i, serie: serieDoTexto(i.pesquisa), formato: /carross/i.test(i.pesquisa) ? 'Carrossel' : /stories/i.test(i.pesquisa) ? 'Stories' : 'Reel'}));
}
function lerGanchos(txt){
  const out = [];
  txt.split('\n').forEach(l=>{
    const m = l.match(/^\s*(?:\*\*)?\d{1,2}\s*[\.\)\-–]\s*(.+)$/);
    if(m){
      let r = limpa(m[1]), angulo = '', motivo = '';
      const a = r.match(/^\[([^\]]+)\]\s*/) || r.match(/^\(([^)]+)\)\s*/) || r.match(/^([A-Za-zÀ-ú ]{3,20}):\s+/);
      if(a){ angulo = a[1].trim(); r = r.slice(a[0].length); }
      const sp = r.split(/\s+[—–]\s+|\s+-\s+(?=motivo|por qu)/i);
      if(sp.length>1){ r = sp[0]; motivo = sp.slice(1).join(' — ').replace(/^(motivo|por qu[eê])\s*:\s*/i,''); }
      out.push({texto:r.replace(/^["“]|["”]$/g,'').trim(), angulo, motivo});
    } else if(out.length && /^\s*[-•]?\s*(motivo|por qu[eê])\s*:/i.test(l)){ out[out.length-1].motivo = limpa(l.replace(/^\s*[-•]?\s*(motivo|por qu[eê])\s*:\s*/i,'')); }
  });
  return out.filter(g=>g.texto).slice(0,10);
}

function numerosDoPerfil(m){
  const num = v => Number(v)||0;
  const seg = (m.seg||[]).filter(r=>num(r.follows_and_unfollows)>0);
  const entraram = seg.reduce((a,r)=>a+num(r.follower_count),0);
  const sairam = seg.reduce((a,r)=>a+Math.max(0,num(r.follows_and_unfollows)-num(r.follower_count)),0);
  const dias = (m.dias||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const posts = (m.posts||[]).slice().sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp)));
  const ultimo = posts[0];
  const titulo = p => { const t = String(p.media_caption||'').split('\n')[0].trim(); return t.length>46 ? t.slice(0,45).trim()+'…' : t || 'Sem legenda'; };
  const hist = Object.keys(m.historico||{}).sort();
  return {seguidores:num(m.perfil&&m.perfil.followers_count), entraram, sairam, saldo:entraram-sairam, nSeg:seg.length, dias, views:dias.reduce((a,r)=>a+num(r.views),0), ultimo, melhor:posts.slice().sort((a,b)=>num(b.media_views)-num(a.media_views))[0], titulo,

}

  const quadril = new THREE.Group(); quadril.position.y = .56; raiz.add(quadril);
  const pernas = [-1,1].map(s=>{
    const coxa = new THREE.Group(); coxa.position.set(s*.13,0,0); quadril.add(coxa);
    malha(new THREE.BoxGeometry(.2,.3,.22), calca, 0,-.15,0, coxa);
    const canela = new THREE.Group(); canela.position.y = -.3; coxa.add(canela);
    malha(new THREE.BoxGeometry(.18,.24,.2), calca, 0,-.12,0, canela);

    return {coxa, canela};
  });
  const tronco = new THREE.Group(); tronco.position.y = .56; raiz.add(tronco);

  malha(new THREE.BoxGeometry(.2,.06,.02), mat(m.detalhe,{roughness:.6}), 0,.5,.17, tronco);
  const bracos = [-1,1].map(s=>{
    const ombro = new THREE.Group(); ombro.position.set(s*.33,.52,0); tronco.add(ombro);
    malha(new THREE.BoxGeometry(.14,.3,.16), roupa, 0,-.15,0, ombro);
    const cotovelo = new THREE.Group(); cotovelo.position.y = -.3; ombro.add(cotovelo);
    malha(new THREE.BoxGeometry(.13,.24,.14), roupa, 0,-.12,0, cotovelo);
    malha(new THREE.BoxGeometry(.12,.1,.12), pele, 0,-.28,0, cotovelo);
    return {ombro, cotovelo};
  });
  const cab = new THREE.Group(); cab.position.y = .64; tronco.add(cab);
  malha(new THREE.BoxGeometry(.5,.48,.46), pele, 0,.24,0, cab);
  malha(new THREE.BoxGeometry(.54,.16,.5), cabelo, 0,.5,-.01, cab);

  if(m.cabeloLongo) malha(new THREE.BoxGeometry(.56,.5,.14), cabelo, 0,.15,-.22, cab);

}

/* rotas: corredor da frente z=CZ e corredor do meio x=CX; os destinos dizem por onde chegar */
const CZ = 6.2, CX = .6;
const DESTINOS = {
  agua:{lado:'frente', via:[[11.6,CZ],[11.6,4.75]], olha:Math.PI, acao:'beber', t:[4,7]},
  cafe:{lado:'frente', via:[[13.1,CZ],[13.1,2.2]], olha:Math.PI/2, acao:'beber', t:[5,8]},
  banheiro:{lado:'fundo', via:[[CX,-8.6],[4.2,-8.6],[4.2,-9.45]], olha:Math.PI, acao:'sumir', t:[6,10]},
  sofa:{lado:'frente', via:[[3.3,CZ],[3.3,8.15],[4.4,8.15]], olha:Math.PI, acao:'sofa', t:[7,12]},
  janela:{lado:'frente', via:[[-4,CZ],[-4,9.25]], olha:0, acao:'olhar', t:[4,7]},
  telao:{lado:'fundo', via:[[CX,-8.6],[-2,-8.6]], olha:Math.PI, acao:'olhar', t:[3,6]}
};
function caminho(p, chave){
  const d = DESTINOS[chave], pts = [p.assento, ...p.saida], hub = pts[pts.length-1];
  const noCorredor = Math.abs(hub[1]-CZ) < .01;
  if(!noCorredor && d.lado==='frente') pts.push([CX,CZ]);
  if(noCorredor && d.lado==='fundo'){ pts.push([CX,CZ]); }
  if(!noCorredor && d.lado==='fundo'){ /* já está no corredor do meio */ }
  pts.push(...d.via);
  return pts.filter((q,i)=>i===0 || Math.hypot(q[0]-pts[i-1][0], q[1]-pts[i-1][1]) > .05);
}

/* ---------- Roteiro legível: o texto do Claude vira Fala, Cenas, Postar e Notas ---------- */
const semMd = t => String(t||'').replace(/<br\s*\/?>/gi,' ').replace(/\*\*|__|`/g,'').replace(/\s+/g,' ').trim();
const inlineMd = t => esc(t).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
const celulas = l => l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
const ehTabela = l => /^\s*\|/.test(l);
const ehRegua = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
function mdHTML(txt){
  const ls = String(txt||'').split('\n'); let h = '', lista = false, tab = null;
  const fechaL = () => { if(lista){ h += '</ul>'; lista = false; } };
  const fechaT = () => { if(tab){ tab.linhas.forEach(r=>{ h += `<p>${r.map((v,i)=>tab.cab[i]?`<b>${inlineMd(semMd(tab.cab[i]))}:</b> ${inlineMd(v)}`:inlineMd(v)).join('<br>')}</p>`; }); tab = null; } };
  ls.forEach(l=>{
    if(ehTabela(l)){ fechaL(); if(ehRegua(l)) return; const c = celulas(l); if(!tab) tab = {cab:c, linhas:[]}; else tab.linhas.push(c); return; }
    fechaT();
    const t = l.trim();
    if(!t){ fechaL(); return; }
    let m;
    if((m = t.match(/^#{1,6}\s+(.+)/))){ fechaL(); h += `<h5>${inlineMd(m[1])}</h5>`; return; }
    if((m = t.match(/^(?:[-*•]|\d+[.)])\s+(.+)/))){ if(!lista){ h += '<ul>'; lista = true; } h += `<li>${inlineMd(m[1])}</li>`; return; }
    fechaL(); h += `<p>${inlineMd(t)}</p>`;
  });

}
function lerRoteiro(txt){

  const ls = String(txt||'').split('\n');
  let sec = {nome:'', linhas:[]}; r.secoes.push(sec);
  for(let i=0;i<ls.length;i++){

    if(!r.titulo && /^#\s+/.test(t)){ r.titulo = semMd(t.replace(/^#\s+/,'')); continue; }
    const h = t.match(/^#{2,6}\s+(.+)/) || t.match(/^\*\*([^*]+?):?\*\*:?$/);
    if(h){ sec = {nome:semMd(h[1]).replace(/:$/,''), linhas:[]}; r.secoes.push(sec); continue; }
    // A primeira tabela com coluna de fala ou texto é o roteiro.
    if(ehTabela(l) && !r.cenas.length && ls[i+1] && ehRegua(ls[i+1])){
      const cab = celulas(l).map(x=>semMd(x).toLowerCase());
      const col = re => cab.findIndex(x=>re.test(x));
      const cF = col(/fala|\bvo\b|voz|narra|texto do painel|copy/), cT = col(/texto na tela|na tela|tela|texto/), cI = col(/imagem|b-roll|visual/), cA = col(/[áa]udio|som/), cP = col(/tempo|cena|painel/);
      if(cF>=0 || cT>=0){
        r.colunaDePainel = cP>=0 && /painel/.test(cab[cP]);
        i += 2;
        for(; i<ls.length && ehTabela(ls[i]); i++){
          const c = celulas(ls[i]);
          const pedacos = String(c[cP<0?0:cP]||'').split(/<br\s*\/?>|\s+·\s+/i).map(semMd).filter(Boolean);
          const fase = pedacos.find(x=>/^(aten[cç][aã]o|interesse|desejo|a[cç][aã]o)\b/i.test(x)) || '';
          r.cenas.push({tempo:pedacos[0]||'', fase:fase.toUpperCase().split(' ')[0], mec:pedacos.filter(x=>x!==pedacos[0]&&x!==fase).join(' · '),

function designHTML(c){

  const pecas = (d.pecas||[]).map((x,i)=>`<div class="cena">${x.img?`<img class="mock" src="${esc(x.img)}" alt="${esc(x.nome)}" loading="lazy">`:''}<div class="cena-topo"><time>${esc(x.nome)}</time><small>${esc(x.proporcao)} · ${esc(x.uso)}</small></div>${x.img?'':`<div class="bts"><button class="btn min" data-ac="copiarpeca" data-id="${c.id}" data-i="${i}">Copiar prompt</button><a class="btn min" href="${MAGNIFIC_URL}" target="_blank" rel="noopener">Abrir o Magnific</a></div>`}</div>`).join('');
  const paineis = (d.paineis||[]).map((x,i)=>`<div class="cena"><div class="cena-topo"><time>Painel ${i+1}</time><small>${esc(x.titulo)}</small></div><q>${esc(x.texto)}</q><dl><dt>Layout</dt><dd>${esc(x.layout)}</dd></dl></div>`).join('');
  const prontas = (d.pecas||[]).filter(x=>x.img).length;
  return `<div class="rot"><div class="rot-topo"><span class="pill">Design</span>${(d.pecas||[]).length?`<span class="pill">${prontas} de ${d.pecas.length} imagens</span>`:''}</div>
    ${paineis}${pecas}
    <details class="pesq"><summary>Direção de arte</summary><div class="md">${mdHTML(d.direcao)}</div></details>
    ${d.avisos?`<div class="rot-aviso">${inlineMd(d.avisos)}</div>`:''}</div>`;
}
function cardHTML(c, mesa){
  const prox = proxima(c), ant = anterior(c);
  const trava = (c.etapa==='gancho' && c.escolhido==null) || ocupado(c.agente);
  const av = prox ? `<button class="btn min prim" data-ac="avancar" data-id="${c.id}"${trava?' disabled':''}>${prox==='noar'?'Marcar como postado':'Enviar para '+M[ETAPAS[prox].mesa].nome}</button>` : '';
  const g = ganchoEscolhido(c);
  let corpo = agenteHTML(c.agente, `<button class="btn min" data-ac="agente" data-id="${c.id}">Tentar de novo</button>`);
  if(c.nota) corpo += `<p>${esc(c.nota)}</p>`;
  if(c.pesquisa && (c.etapa==='pauta' || c.etapa==='gancho')) corpo += `<details class="pesq"${c.etapa==='pauta'?' open':''}><summary>Pesquisa</summary><div class="md">${mdHTML(c.pesquisa)}</div></details>`;
  if(c.etapa==='gancho') corpo += ganchosHTML(c);
  if(g && c.etapa!=='gancho' && c.etapa!=='noar') corpo += `<div class="escolhido"><small>Abre com</small>${esc(g.texto)}</div>`;
  if(c.design) corpo += designHTML(c);
  if(c.planoGravacao && c.etapa==='gravar') corpo += `<details class="pesq"><summary>Plano de gravação</summary><div class="md">${mdHTML(c.planoGravacao)}</div></details>`;
  if(c.briefEdicao && c.etapa==='edicao') corpo += `<details class="pesq" open><summary>Plano de edição</summary><div class="md">${mdHTML(c.briefEdicao)}</div></details>`;
  if(c.roteiro && (c.etapa==='gravar' || c.etapa==='edicao' || c.etapa==='design')) corpo += roteiroHTML(c, c.etapa==='gravar'?'fala':'cenas');
  if(c.legenda && c.etapa==='postar') corpo += `<details class="pesq" open><summary>Legenda e plano da primeira hora</summary><div class="md">${mdHTML(c.legenda)}</div></details><div class="bts"><button class="btn min" data-ac="copiarlegenda" data-id="${c.id}">Copiar legenda</button></div>`;
  if(c.etapa==='noar') corpo += `<label for="v-${c.id}">Views<input type="number" min="0" id="v-${c.id}" data-ac="views" data-id="${c.id}" value="${c.views||''}" placeholder="0"></label>`;
  let extra = '';
  if(c.etapa==='pauta') extra = `${agentesLigados()&&!c.agente&&!c.exemplo?`<button class="btn min prim" data-ac="agente" data-id="${c.id}">Rodar agentes</button>`:''}<button class="btn min" data-ac="prompt" data-id="${c.id}">Copiar prompt para aprofundar</button>`;
  if(c.etapa==='gravar') extra = `<button class="btn min" data-ac="gravacao" data-id="${c.id}">Modo gravação</button>${agentesLigados()&&!c.agente&&!c.design&&!c.exemplo?`<button class="btn min" data-ac="agente" data-so="design" data-id="${c.id}">Pedir mockups ao Designer</button>`:''}`;
  if(c.etapa==='design' && agentesLigados() && !c.agente && !c.exemplo) extra = `<button class="btn min" data-ac="agente" data-so="design" data-id="${c.id}">Refazer direção de arte</button>`;
  if(c.etapa==='edicao' || c.etapa==='postar') extra = `${c.etapa==='postar'&&agentesLigados()&&!c.agente&&!c.exemplo?`<button class="btn min" data-ac="agente" data-so="legenda" data-id="${c.id}">${c.legenda?'Reescrever legenda':'Gerar legenda'}</button>`:''}<button class="btn min" data-ac="prompt" data-id="${c.id}">Copiar prompt</button>`;
  return `<div class="card">
    <div class="linha"><h4>${esc(c.titulo)}</h4></div>
    <div class="linha"><span class="pill fmt">${c.formato}</span>${serieDe(c)?`<span class="pill serie" style="--sc:${serieDe(c).cor}">${esc(serieDe(c).nome)}</span>`:''}${M[ETAPAS[c.etapa].mesa].etapas.length>1?`<span class="pill">${ETAPAS[c.etapa].nome}</span>`:''}${c.exemplo?'<span class="pill ex">exemplo</span>':''}</div>
    ${corpo}
    <div class="bts">${av}${extra}${ant?`<button class="btn min" data-ac="voltar" data-id="${c.id}">Voltar etapa</button>`:''}<button class="btn min" data-ac="apagar" data-id="${c.id}">Excluir</button></div>
  </div>`;
}

  let h = '';
  if(id==='assistente'){
    const g = naEtapa('gravar');
    h += `<div class="secao"><h3>Mensagem de hoje</h3><div class="zapmsg">${esc(msgZap())}</div>
      <div class="bts"><button class="btn min prim" data-ac="copiarzap">Copiar mensagem</button><a class="btn min" href="https://wa.me/?text=${encodeURIComponent(msgZap())}" target="_blank" rel="noopener">Abrir no WhatsApp</a></div></div>`;

  } else if(id==='social'){
    const noar = naEtapa('noar'), tot = noar.reduce((a,c)=>a+(c.views||0),0);

    ['postar','noar'].forEach(e=>{ const cs = naEtapa(e); h += `<div class="secao"><h3>${ETAPAS[e].nome} (${cs.length})</h3>${cs.length?cs.map(c=>cardHTML(c,id)).join(''):'<div class="vazio">Vazio por enquanto.</div>'}</div>`; });
    h += `<p class="skill">Skill sugerida: <code>${m.skill}</code></p>`;
  } else {
    const cs = daMesa(id);
    if(id==='pesquisador'){
      const manual = `<p class="dica-card"><b>1.</b> Copie o prompt e rode no Claude. <b>2.</b> Cole o <code>pesquisa-da-semana.md</code> aqui. Cada assunto vira uma pauta com a pesquisa anexada.</p>
      <div class="bts"><button class="btn min prim" data-ac="promptgeral">Copiar prompt da pesquisa da semana</button><button class="btn min" data-ac="nova">Pauta avulsa</button></div>
      <textarea id="imp" rows="4" aria-label="Colar pesquisa da semana" placeholder="## Assunto 1&#10;Por que está quente…&#10;## Assunto 2…"></textarea>
      <div class="bts"><button class="btn min" data-ac="importar">Criar pautas a partir da pesquisa</button></div>`;
      const semana = (S.agentes||{}).semana;
      h += agentesLigados()
        ? `<div class="secao ciclo"><h3>Ciclo de terça · próxima pesquisa ${proximaTerca()}</h3>
          <p class="dica-card">Toda terça, às 9h, o Pesquisador traz as pautas da semana sozinho, e cada uma já segue para o Roteirista. Pauta que você jogar aqui entra na mesma esteira.</p>
          ${agenteHTML(semana, `<button class="btn min" data-ac="geral" data-acao="semana">Tentar de novo</button>`)}
          <div class="bts">${ocupado(semana)?'':`<button class="btn min prim" data-ac="geral" data-acao="semana">Buscar pautas agora</button>`}<button class="btn min" data-ac="nova">Pauta avulsa</button></div>
          <details class="manual"><summary>Fazer manualmente</summary>${manual}</details></div>`
        : `<div class="secao ciclo"><h3>Ciclo de terça · próxima pesquisa ${proximaTerca()}</h3>${nuvem.on?'<p class="dica-card">Agentes desligados: falta a chave da API do Claude no servidor.</p>':''}${manual}</div>`;
    }
    h += `<div class="secao"><h3>Na mesa (${cs.length})</h3>${cs.length?cs.map(c=>cardHTML(c,id)).join(''):`<div class="vazio">${id==='estudio'?'Nada para gravar agora.':id==='editor'?'Sem bruto esperando edição.':id==='designer'?'Nenhum carrossel ou mockup esperando.':id==='roteirista'?'Nenhum assunto esperando gancho. Mande uma pauta do Pesquisador.':'Sem pauta. Rode a pesquisa da semana e cole o resultado acima.'}</div>`}</div>`;
    h += `<p class="skill">Skill sugerida: <code>${m.skill}</code></p>`;
  }
  h += `<textarea class="fallback" id="fallback" hidden aria-label="Texto para copiar"></textarea>`;
  $('g-corpo').innerHTML = h;

function copiar(txt){
  const falha = ()=>{ const t = $('fallback'); if(t){ t.hidden = false; t.value = txt; t.focus(); t.select(); } toast('Texto selecionado. Use ⌘C para copiar'); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast('Copiado'), falha); }catch(e){ falha(); }
}
let tT; function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tT); tT = setTimeout(()=>el.hidden = true, 1900); }

let apagando = null;
$('g-corpo').addEventListener('click', e=>{
  const b = e.target.closest('[data-ac]'); if(!b || b.tagName==='INPUT') return;
  const c = S.cards.find(x=>x.id===b.dataset.id);
  switch(b.dataset.ac){
    case 'avancar': { const de = ETAPAS[c.etapa].mesa; c.etapa = proxima(c); const para = ETAPAS[c.etapa].mesa; if(de!==para) voar(de,para); salvar(); render(); toast(c.etapa==='noar'?'Postado. O Social acompanha.':`Enviado para ${M[para].nome}`); varrer(); break; }
    case 'voltar': { const de = ETAPAS[c.etapa].mesa; c.etapa = anterior(c); const para = ETAPAS[c.etapa].mesa; if(de!==para) voar(de,para); salvar(); render(); break; }
    case 'apagar': if(apagando===c.id){ S.cards = S.cards.filter(x=>x!==c); apagando = null; salvar(); render(); toast('Excluído'); } else { apagando = c.id; b.textContent = 'Confirmar exclusão'; } break;
    case 'prompt': copiar(promptDe(ETAPAS[c.etapa].mesa, c)); break;
    case 'promptroteiro': copiar(promptDe('roteirista', c, 'roteiro')); break;
    case 'promptgeral': copiar(promptDe(aberta, null)); break;
    case 'copiarzap': copiar(msgZap()); break;
    case 'copiarbio': copiar(DNA.bio); break;
    case 'promptplano': copiar(promptDe('estrategia', null)); break;
    case 'promptolivetto': copiar(promptDe('estrategia', null, 'olivetto')); break;
    case 'nova': abrirNova(); break;
    case 'lerganchos': { const gs = lerGanchos($('g-'+c.id).value); if(!gs.length){ toast('Não achei ganchos numerados. Cole no formato 1. [ângulo] gancho — motivo'); break; } c.ganchos = gs; c.escolhido = null; salvar(); render(); toast(`${gs.length} ganchos na mesa`); break; }
    case 'refazer': if(agentesLigados()){ agenteDoCard(c,'ganchos'); break; } c.ganchos = []; c.escolhido = null; salvar(); render(); break;
    case 'agente': agenteDoCard(c, b.dataset.so); break;
    case 'geral': agenteChamar({acao:b.dataset.acao}); break;
    case 'copiarlegenda': copiar(c.legenda); break;
    case 'copiarpeca': copiar(c.design.pecas[+b.dataset.i].prompt); break;
    case 'rotaba': abaRoteiro[c.id] = b.dataset.aba; render(); break;
    case 'copiarsec': { const x = lerRoteiro(c.roteiro).secoes.find(y=>y.nome===b.dataset.nome); if(x) copiar(x.texto.replace(/\*\*/g,'')); break; }
    case 'gravacao': abrirGravacao(c); break;
    case 'importar': { const itens = lerPesquisa($('imp').value); if(!itens.length){ toast('Não achei assuntos. Use um "## " antes de cada assunto'); break; } itens.reverse().forEach((it,k)=>S.cards.unshift({id:'c'+Date.now().toString(36)+k, titulo:it.titulo, formato:it.formato, serie:it.serie, etapa:'pauta', pesquisa:it.pesquisa, criado:Date.now()})); salvar(); render(); toast(`${itens.length} pautas criadas`); break; }
  }
});
$('g-corpo').addEventListener('change', e=>{
  const d = e.target.dataset, c = S.cards.find(x=>x.id===d.id); if(!c) return;
  if(d.ac==='views'){ c.views = Math.max(0, parseInt(e.target.value)||0); salvar(); render(); }
  if(d.ac==='escolher'){ c.escolhido = +d.i; salvar(); render(); }
  if(d.ac==='roteiro'){ c.roteiro = e.target.value; salvar(); }
});

function abrirGravacao(c){
  const g = ganchoEscolhido(c);
  $('p-titulo').textContent = c.titulo;
  $('p-gancho').textContent = g ? g.texto : '';
  const rg = lerRoteiro(c.roteiro), falas = rg.cenas.filter(x=>!semFala(x.fala));
  if(falas.length) $('p-roteiro').innerHTML = falas.map(x=>`<p class="p-fala"><small>${esc(x.tempo)}</small>${esc(x.fala)}</p>`).join('');
  else $('p-roteiro').textContent = c.roteiro || 'Sem roteiro. Grave só com o gancho.';
  $('prompter').hidden = false; $('p-fechar').focus();
}

setInterval(()=>{
  if(!nuvem.on || document.hidden || nuvem.enviando) return;
  const el = document.activeElement;
  if(el && /^(TEXTAREA|INPUT|SELECT)$/.test(el.tagName) && !el.closest('label.gch')) return;
  const rodando = S.cards.some(c=>ocupado(c.agente)) || Object.values(S.agentes||{}).some(ocupado);
  nuvem.tique = (nuvem.tique+1)%6;
  nuvem.tiqueM = ((nuvem.tiqueM||0)+1)%120; if(nuvem.tiqueM===0) metricasPuxar(); // a cada 10 min
  if(rodando || nuvem.tique===0) nuvemPuxar(false);
}, 5000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && nuvem.on && !nuvem.enviando) nuvemPuxar(false); });
[$('modal'),$('modal-arroba')].forEach(md=>md.addEventListener('click', e=>{ if(e.target===md) md.hidden = true; }));

/* ---------- Loop ---------- */
function redimensionar(){ const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); GERAL.r = w<700 ? 110 : (w/h<1.1 ? 88 : 72); }
addEventListener('resize', redimensionar); redimensionar();
cam.r = des.r = GERAL.r;

/* ---------- Tour ---------- */
const ORDEM_TOUR = ['pesquisador','roteirista','designer','estudio','editor','social','assistente'];
let tourAtual = null, tourTimer = null, ultimoToque = 0, vidaPausada = false;
$('pausa').addEventListener('click', ()=>{ vidaPausada = !vidaPausada; $('pausa').setAttribute('aria-pressed', String(vidaPausada)); $('pausa').textContent = vidaPausada ? 'Retomar' : 'Pausar'; });
function mostrarLegenda(id, i){
  const m = M[id];
  $('lg-olho').textContent = `Etapa ${i+1} · ${m.papel}`;
  $('lg-nome').textContent = m.nome;
  $('lg-faz').textContent = m.faz.split('. ')[0].replace(/\.$/,'') + '.';
  $('legenda').hidden = false;
}
function passoTour(i){
  if(i >= ORDEM_TOUR.length){ pararTour(); irPara(GERAL); return; }
  tourAtual = ORDEM_TOUR[i]; focarMesa(tourAtual); mostrarLegenda(tourAtual, i);
  tourTimer = setTimeout(()=>passoTour(i+1), 6500);
}
function iniciarTour(){ fechar(); clearTimeout(tourTimer); $('tour').setAttribute('aria-pressed','true'); $('tour').textContent = '■ Parar tour'; passoTour(0); }
function pararTour(){ clearTimeout(tourTimer); tourAtual = null; $('legenda').hidden = true; $('tour').setAttribute('aria-pressed','false'); $('tour').textContent = '▶ Tour'; }
$('tour').addEventListener('click', ()=> tourAtual ? (pararTour(), irPara(GERAL)) : iniciarTour());
canvas.addEventListener('pointerdown', ()=>{ ultimoToque = performance.now(); if(tourAtual) pararTour(); });
canvas.addEventListener('wheel', ()=>{ ultimoToque = performance.now(); });

/* ---------- Vida no escritório ---------- */
const relogio = new THREE.Clock();
const aleat = (a,b) => a + Math.random()*(b-a);
const lerpAng = (a,b,k) => { let d = ((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a + d*k; };
const PESOS = [['agua',.24],['cafe',.2],['banheiro',.14],['sofa',.16],['janela',.14],['telao',.12]];
function sorteiaDestino(){ let r = Math.random(), acc = 0; for(const [k,w] of PESOS){ acc += w; if(r <= acc) return k; } return 'agua'; }

function poseSentado(p, t, i, digitando){
  p.quadril.position.y = .52; p.tronco.position.y = .52;
  p.pernas.forEach(l=>{ l.coxa.rotation.x = -Math.PI/2; l.canela.rotation.x = Math.PI/2; });
  p.bracos.forEach((b,k)=>{ b.ombro.rotation.x = -.75; b.ombro.rotation.z = 0; b.cotovelo.rotation.x = -.75 + (digitando ? Math.sin(t*12+i*3+k*1.7)*.07 : 0); });
  p.cab.rotation.x = .1 + Math.sin(t*.7+i)*.05; p.cab.rotation.y = Math.sin(t*.33+i*2)*.18;
}
function poseAndando(p, t){
  const ph = p.passo;
  p.quadril.position.y = .56 + Math.abs(Math.sin(ph))*.03; p.tronco.position.y = p.quadril.position.y;
  p.pernas.forEach((l,k)=>{ const s = Math.sin(ph + k*Math.PI); l.coxa.rotation.x = s*.55; l.canela.rotation.x = Math.max(0, -s)*.8; });
  p.bracos.forEach((b,k)=>{ b.ombro.rotation.x = -Math.sin(ph + k*Math.PI)*.45; b.ombro.rotation.z = 0; b.cotovelo.rotation.x = -.25; });
  p.cab.rotation.x = 0; p.cab.rotation.y *= .9;
}
function poseEmPe(p, t, i){
  p.quadril.position.y = .56; p.tronco.position.y = .56;
  p.pernas.forEach(l=>{ l.coxa.rotation.x = 0; l.canela.rotation.x = 0; });
  p.bracos.forEach(b=>{ b.ombro.rotation.x = 0; b.ombro.rotation.z = 0; b.cotovelo.rotation.x = -.1; });
  p.cab.rotation.y = Math.sin(t*.5+i)*.35; p.cab.rotation.x = Math.sin(t*.3+i)*.06;
}
function andar(p, dt, vel){
  const alvo = p.rota[p.i], pos = p.g.position;
  const dx = alvo[0]-pos.x, dz = alvo[1]-pos.z, d = Math.hypot(dx,dz), v = vel*dt;
  if(d > .001) p.g.rotation.y = lerpAng(p.g.rotation.y, Math.atan2(dx,dz), Math.min(1, dt*9));
  if(d <= v){ pos.x = alvo[0]; pos.z = alvo[1]; p.i++; return p.i >= p.rota.length; }
  pos.x += dx/d*v; pos.z += dz/d*v; p.passo = (p.passo||0) + dt*vel*5.2;
  return false;
}
function sentaNaMesa(p){ p.g.position.set(p.assento[0], 0, p.assento[1]); p.g.rotation.y = Math.PI; p.g.visible = true; p.copo.visible = false; p.estado = 'sentado'; }
pessoas.forEach(p=>{ if(!p.estudio) sentaNaMesa(p); });

function vidaPessoas(dt, t){
  const fora = pessoas.filter(p=>!p.estudio && p.estado!=='sentado').length;
  pessoas.forEach((p,i)=>{
    if(p.estudio){
      const grav = naEtapa('gravar').length>0;
      p.cab.rotation.y = Math.sin(t*1.1)*.18;
      p.bracos[1].ombro.rotation.x = grav ? -.6 + Math.sin(t*2.4)*.25 : -.2;
      p.bracos[1].ombro.rotation.z = grav ? Math.sin(t*1.7)*.2 : 0;
      p.tronco.rotation.z = Math.sin(t*.9)*.03;
      return;
    }
    const ocupado = aberta===p.mesa || tourAtual===p.mesa;
    switch(p.estado){
      case 'sentado':
        poseSentado(p, t, i, true);
        if(!ocupado) p.timer -= dt;
        if(p.timer <= 0 && fora < 2){ p.dest = sorteiaDestino(); p.rota = caminho(p, p.dest); p.i = 1; p.estado = 'indo'; p.g.position.set(p.assento[0],0,p.assento[1]); }
        else if(p.timer <= 0) p.timer = aleat(3,8);
        break;
      case 'indo':
      case 'voltando':
        poseAndando(p, t);
        if(andar(p, dt, 1.55)){
          if(p.estado==='voltando'){ sentaNaMesa(p); p.timer = aleat(14,38); break; }
          const d = DESTINOS[p.dest]; p.estado = 'acao'; p.timer = aleat(...d.t); p.alvoRot = d.olha;
          if(d.acao==='sumir') p.g.visible = false;
          if(d.acao==='beber') p.copo.visible = true;
        }
        break;
      case 'acao': {
        const d = DESTINOS[p.dest];
        p.g.rotation.y = lerpAng(p.g.rotation.y, p.alvoRot, Math.min(1, dt*6));
        if(d.acao==='sofa'){ poseSentado(p, t, i, false); p.g.position.y = .12; p.bracos.forEach(b=>{ b.ombro.rotation.x = -.25; b.cotovelo.rotation.x = -.5; }); p.cab.rotation.y = Math.sin(t*.4+i)*.4; }
        else { poseEmPe(p, t, i); }
        if(d.acao==='beber'){ const gole = (Math.sin(t*1.3+i) > .55); p.bracos[1].ombro.rotation.x = gole ? -2.3 : -.9; p.bracos[1].cotovelo.rotation.x = gole ? -1.1 : -1.2; p.cab.rotation.x = gole ? -.18 : 0; }
        p.timer -= dt;
        if(p.timer <= 0 || (ocupado && d.acao!=='sumir')){
          p.g.visible = true; p.copo.visible = false; p.g.position.y = 0;
          p.rota = caminho(p, p.dest).reverse(); p.i = 1; p.estado = 'voltando';
        }
        break;
      }
    }
  });
}

function vidaGato(dt, t){
  const c = gato, pos = c.g.position;
  c.segs.forEach((s,k)=>{ s.rotation.y = Math.sin(t*(c.estado==='andando'?6:2.2) + k*.6)*(.25+k*.08); s.rotation.x = k===0 ? (c.estado==='deitado' ? .2 : -.7) : -.12; });
  c.cab.rotation.y = Math.sin(t*.45)*.5;
  if(c.estado==='andando'){
    const [ax,az] = c.alvo, dx = ax-pos.x, dz = az-pos.z, d = Math.hypot(dx,dz), v = .9*dt;
    c.g.rotation.y = lerpAng(c.g.rotation.y, Math.atan2(dx,dz), Math.min(1, dt*6));
    c.corpo.position.y = .3 + Math.abs(Math.sin(t*10))*.015; c.corpo.rotation.x = 0;
    c.patas.forEach((p,k)=>{ p.rotation.x = Math.sin(t*10 + (k%2?Math.PI:0) + (k>1?Math.PI/2:0))*.5; p.scale.y = 1; });
    pos.y += ((c.lugar[2]==='sofa' && d<.6 ? .62 : 0) - pos.y)*Math.min(1, dt*8);
    if(d <= v){ pos.x = ax; pos.z = az; c.estado = c.lugar[2]==='deitar' ? 'deitado' : 'sentado'; c.timer = aleat(6,16); }
    else { pos.x += dx/d*v; pos.z += dz/d*v; }
  } else {
    c.timer -= dt;
    if(c.estado==='deitado'){ c.corpo.position.y = .17; c.corpo.rotation.x = 0; c.patas.forEach(p=>{ p.scale.y = .3; p.rotation.x = 0; }); c.corpo.scale.y = 1 + Math.sin(t*1.6)*.03; }
    else { c.corpo.position.y = .3; c.corpo.rotation.x = -.45; c.patas.forEach((p,k)=>{ p.scale.y = k<2 ? 1 : .55; p.rotation.x = 0; }); }
    if(c.timer <= 0){
      const opcoes = LUGARES_GATO.filter(l=>l!==c.lugar);
      c.lugar = opcoes[Math.floor(Math.random()*opcoes.length)]; c.alvo = [c.lugar[0], c.lugar[1]]; c.estado = 'andando'; c.corpo.scale.y = 1;
    }
  }
}
gato.lugar = LUGARES_GATO[0];

function loop(){
  const dt = Math.min(relogio.getDelta(), .05), t = relogio.elapsedTime;
  const k = 1 - Math.pow(.003, dt);
  cam.theta += (des.theta-cam.theta)*k; cam.phi += (des.phi-cam.phi)*k; cam.r += (des.r-cam.r)*k; cam.alvo.lerp(des.alvo,k);
  if(!reduz && !aberta && !tourAtual && ptrs.size===0 && performance.now()-ultimoToque > 9000) des.theta = limTheta(GERAL.theta + Math.sin(t*.05)*.35);
  aplicarCam();
  const agora = new Date();
  const hm = agora.getHours()%12 + agora.getMinutes()/60, mm = agora.getMinutes() + agora.getSeconds()/60;
  ponteiroH.rotation.z = -hm/12*Math.PI*2; ponteiroH.position.set(Math.sin(hm/12*Math.PI*2)*.12, Math.cos(hm/12*Math.PI*2)*.12, .05);
  ponteiroM.rotation.z = -mm/60*Math.PI*2; ponteiroM.position.set(Math.sin(mm/60*Math.PI*2)*.18, Math.cos(mm/60*Math.PI*2)*.18, .06);
  const grav = naEtapa('gravar').length>0;
  if(!vidaPausada){
    vidaPessoas(dt, t);
    vidaGato(dt, t);
    transito.forEach(c=>{ const x = c.g.position.x + c.dir*c.vel*dt; c.g.position.x = x > 150 ? -150 : x < -150 ? 150 : x; });
    pedestres.forEach(p=>{ const lim = p.praca ? 13 : 75; p.g.position.x += p.dir*p.vel*dt; if(Math.abs(p.g.position.x) > lim){ p.dir *= -1; p.g.rotation.y = p.dir>0 ? Math.PI/2 : -Math.PI/2; } p.passo += dt*p.vel*5.2; poseAndando(p, t); });
    const st = palcos.assistente.userData;
    if(st.cel){ st.cel.rotation.y = grav && (t%2.2<.5) ? Math.sin(t*70)*.06 : 0; st.celTela.visible = !grav || (t%1<.75); }
  }
  palcos.estudio.userData.onair.material.color.setScalar(grav ? (reduz?1:.55+.45*Math.abs(Math.sin(t*2))) : .25);
  Object.entries(holos).forEach(([id,h])=>{ const alvo = id===aberta || id===tourAtual ? 1 : id===sobre ? 1 : (aberta||tourAtual) ? .35 : .92; h.sp.material.opacity += (alvo - h.sp.material.opacity)*.12; });
  MESAS.forEach(m=>{ const a = palcos[m.id].userData.anel; const alvo = m.id===aberta || m.id===tourAtual ? .9 : m.id===sobre ? .5 : 0; a.material.opacity += (alvo-a.material.opacity)*.15; });
  for(let i=voos.length-1;i>=0;i--){ const v = voos[i]; v.t += dt/1.3; const p = Math.min(1,v.t); const e = p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; v.m.position.lerpVectors(v.a,v.b,e); v.m.position.y = 2.6 + Math.sin(p*Math.PI)*4; if(p>=1){ scene.remove(v.m); voos.splice(i,1); } }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(render);
nuvemIniciar();
loop();
})();
</script>
