<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Rethink+Sans:wght@400..800&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Sistema visual herdado da Turnê: o par tipográfico e a paleta vêm da
   página de Brasília e da LP de conferência — Bricolage Grotesque no
   display, Rethink Sans no texto, Montserrat nas etiquetas, ouro sobre
   verde-quase-preto. Tema escuro fixo por decisão: as artes são escuras e
   julgar cor exige um fundo neutro constante. */
:root{
  /* fundo e superfícies */
  --ink:#0A1501;
  --ink-2:#081103;
  --surface:#101B08;
  --surface-2:#16230D;
  --surface-3:#1D2C12;

  /* traços e texto */
  --line:rgba(245,246,240,.13);
  --line-soft:rgba(245,246,240,.07);
  --paper:#F5F6F0;
  --dim:rgba(245,246,240,.64);
  --dim-2:rgba(245,246,240,.40);

  /* marca */
  --gold:#FFCC00;
  --gold-dim:rgba(255,204,0,.30);
  --sage:#77816B;
  --no-acento:#14170A;   /* texto sobre o acento */

  /* semântico, deliberadamente fora da faixa do ouro */
  --ok:#3BA55C;
  --ok-bg:rgba(59,165,92,.12);
  --ok-line:rgba(59,165,92,.34);
  --warn:#E8913A;
  --warn-bg:rgba(232,145,58,.12);
  --warn-line:rgba(232,145,58,.34);
  --bad:#FF6B57;
  --bad-bg:rgba(255,107,87,.12);
  --bad-line:rgba(255,107,87,.34);
  /* publicado: azul, deliberadamente longe do verde de "aprovado" — são
     etapas diferentes e confundir as duas é o erro mais caro aqui */
  --pub:#5B9DF9;
  --pub-bg:rgba(91,157,249,.12);
  --pub-line:rgba(91,157,249,.36);

  /* tipografia */
  --disp:"Bricolage Grotesque",system-ui,sans-serif;
  --sans:"Rethink Sans",system-ui,-apple-system,sans-serif;
  --ui:"Montserrat",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  /* medidas */
  --maxw:100%;        /* a grade de criativos usa a tela toda */
  --maxw-texto:1240px; /* tabela e textos longos ficam contidos */
  --pad:clamp(18px,4vw,56px);
  --r:14px;
  --r-sm:9px;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:dark;
}

/* Tema do Método RGV, tirado da própria landing page: vermelho, preto e
   branco. O par tipográfico é o mesmo — a página do RGV também usa
   Bricolage Grotesque com Rethink Sans —, então só a paleta troca. */
[data-produto="rgv"]{
  --ink:#0D0D0D;
  --ink-2:#080808;
  --surface:#1A1A1A;
  --surface-2:#212121;
  --surface-3:#2B2B2B;

  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.07);
  --paper:#FFFFFF;
  --dim:rgba(255,255,255,.66);
  --dim-2:rgba(255,255,255,.42);

  --gold:#FF3352;          /* o vermelho da marca, clareado para ler bem no escuro */
  --gold-dim:rgba(255,51,82,.34);
  --sage:#AEAEAE;
  --no-acento:#FFFFFF;

  /* o acento já é vermelho, então "reprovado" muda de tom para não confundir */
  --bad:#FF8A66;
  --bad-bg:rgba(255,138,102,.13);
  --bad-line:rgba(255,138,102,.36);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* Largura: a grade de criativos ocupa a tela (cabem 6 por linha em monitor
   grande, que é como se compara arte); só a tabela de páginas fica contida,
   porque linha de texto larga demais é ruim de ler. */
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}

/* etiqueta em caixa alta, o recurso de UI das duas referências */
.rotulo{
  font-family:var(--ui);font-weight:600;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim-2);
}

/* ---------- escolha do produto ---------- */
.escolha{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:60px var(--pad)}
.escolha-in{width:100%;max-width:1040px;display:flex;flex-direction:column;gap:10px}
.escolha-tit{
  font-family:var(--disp);font-weight:600;letter-spacing:-.02em;
  font-size:clamp(28px,4vw,42px);line-height:1.02;margin:0 0 26px;
}
.produtos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.produto{
  position:relative;display:block;padding:0;cursor:pointer;text-align:left;
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:var(--surface);
  transition:border-color .18s var(--ease),transform .18s var(--ease);
}
.produto:hover{border-color:var(--sage);transform:translateY(-3px)}
.produto img{display:block;width:100%;aspect-ratio:5/4;object-fit:cover}
.produto .faixa{
  display:flex;align-items:center;gap:10px;
  padding:15px 18px;border-top:1px solid var(--line);
}
.produto .faixa b{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:-.01em}
.produto .faixa .ir{
  margin-left:auto;font-family:var(--ui);font-weight:600;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);
}
.produto:hover .faixa .ir{color:var(--gold)}

.voltar{
  border:none;background:transparent;cursor:pointer;padding:0;
  display:inline-flex;align-items:center;gap:7px;
}
.voltar:hover{color:var(--paper)}

/* ---------- seções ---------- */
.secoes{border-bottom:1px solid var(--line);background:var(--ink-2)}
.secoes-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);display:flex;gap:4px}
.sec{
  position:relative;padding:15px 4px 14px;margin-right:26px;
  border:none;background:transparent;cursor:pointer;
  font-family:var(--ui);font-weight:600;
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  display:flex;align-items:center;gap:9px;
  transition:color .16s var(--ease);
}
.sec:hover{color:var(--paper)}
.sec[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.sec .qt{
  font-size:10px;letter-spacing:.04em;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--dim);padding:2px 7px;border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.sec[aria-selected="true"] .qt{border-color:var(--gold-dim);color:var(--gold)}

/* ---------- cabeçalho ---------- */
.top{
  padding-top:34px;padding-bottom:28px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:26px 40px;
}
.brand{display:flex;flex-direction:column;gap:9px;min-width:0}
.eyebrow{
  font-family:var(--ui);font-weight:600;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
}
h1{
  font-family:var(--disp);
  font-weight:600;
  font-size:clamp(30px,4vw,46px);
  line-height:1.02;
  letter-spacing:-.02em;
  margin:0;
  text-wrap:balance;
  display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .3em;
}
h1 .sep{color:var(--dim-2);font-size:.6em;font-weight:400}
/* mora dentro do h1, então precisa zerar a herança do display */
.btn-drive{
  align-self:center;
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--ui);font-weight:600;font-size:10.5px;
  letter-spacing:.11em;text-transform:uppercase;line-height:1;
  color:var(--dim);text-decoration:none;white-space:nowrap;
  border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;margin-left:6px;
  transition:color .16s var(--ease),border-color .16s var(--ease),background .16s var(--ease);
}
.btn-drive svg{width:13px;height:13px;fill:currentColor;flex:none}
.btn-drive:hover{color:var(--gold);border-color:var(--gold-dim);background:var(--surface)}
h1 .lote{font-size:.6em;color:var(--gold);font-weight:500}
.subline{
  color:var(--dim);font-size:13.5px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.subline .dot{color:var(--dim-2)}
.subline b{color:var(--paper);font-weight:600}

.tally{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.tally .t{
  display:flex;flex-direction:column;gap:3px;
  padding:12px 16px 13px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--r);
  min-width:86px;
}
.tally .n{
  font-family:var(--disp);font-weight:600;
  font-size:25px;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.tally .l{
  font-family:var(--ui);font-weight:600;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);
}
.t.is-ok{border-color:var(--ok-line)}    .t.is-ok .n{color:var(--ok)}
.t.is-warn{border-color:var(--warn-line)} .t.is-warn .n{color:var(--warn)}
.t.is-bad{border-color:var(--bad-line)}  .t.is-bad .n{color:var(--bad)}
.t.is-pub{border-color:var(--pub-line)}  .t.is-pub .n{color:var(--pub)}

.live{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--ui);font-weight:600;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);
}
.live .bulb{width:7px;height:7px;border-radius:50%;background:var(--dim-2);flex:none}
.live.on .bulb{background:var(--ok);box-shadow:0 0 0 3px rgba(59,165,92,.2)}
.live.off .bulb{background:var(--warn)}

/* ---------- abas de remessa ---------- */
.tabs{border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);display:flex;gap:0}
.tab{
  position:relative;flex:none;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:13px 0 14px;margin-right:30px;
  border:none;background:transparent;cursor:pointer;color:var(--dim);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  text-align:left;white-space:nowrap;
  transition:color .16s var(--ease);
}
.tab:hover{color:var(--paper)}
.tab .tl{font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:-.01em}
.tab .tm{font-family:var(--ui);font-weight:500;font-size:10px;letter-spacing:.06em;color:var(--dim-2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.tab[aria-selected="true"] .tl{color:var(--paper)}
.tab[aria-selected="true"] .tm{color:var(--gold)}
.tab.vazia .tl{font-weight:500;color:var(--dim-2)}
.tab .sinal{position:absolute;top:10px;right:-12px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- área principal ---------- */
.board{
  max-width:var(--maxw);margin:0 auto;
  padding:30px var(--pad) 90px;
}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 24px}
.chip{
  border:1px solid var(--line);background:transparent;color:var(--dim);
  padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;
  transition:border-color .16s var(--ease),color .16s var(--ease);
}
.chip:hover{border-color:var(--sage);color:var(--paper)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--no-acento);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;align-items:start}

.vazio{
  grid-column:1/-1;
  border:1px dashed var(--line);border-radius:var(--r);
  padding:56px 32px;text-align:center;color:var(--dim);
  display:flex;flex-direction:column;gap:9px;align-items:center;
}
.vazio strong{font-family:var(--disp);font-weight:600;font-size:22px;color:var(--paper);letter-spacing:-.01em}
.vazio span{font-size:13.5px;max-width:46ch;line-height:1.65}
.vazio code{
  font-family:var(--mono);font-size:12px;
  background:var(--surface-2);border:1px solid var(--line);
  padding:3px 9px;border-radius:var(--r-sm);color:var(--gold);
}

/* ---------- card de arte ---------- */
.card{
  position:relative;
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);overflow:hidden;
  display:flex;flex-direction:column;
  transition:border-color .16s var(--ease);
}
.card:hover{border-color:var(--sage)}
.card.aberta{border-color:var(--gold-dim)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:3;background:transparent}
.card[data-st="aprovado"]::before{background:var(--ok)}
.card[data-st="ajuste"]::before{background:var(--warn)}
.card[data-st="reprovado"]::before{background:var(--bad)}
.card[data-st="publicado"]::before{background:var(--pub)}

.shot{position:relative;aspect-ratio:4/5;background:var(--ink-2);overflow:hidden;cursor:zoom-in}
.shot img{width:100%;height:100%;object-fit:cover;display:block}

.tagline{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.tag{
  font-family:var(--ui);font-weight:600;
  font-size:10px;letter-spacing:.08em;
  background:rgba(8,17,3,.82);backdrop-filter:blur(6px);
  border:1px solid rgba(245,246,240,.12);
  padding:4px 8px;border-radius:6px;
}
.tag.car{color:var(--gold);border-color:var(--gold-dim)}

.navarrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:28px;height:36px;border:none;border-radius:6px;
  background:rgba(8,17,3,.78);color:#fff;cursor:pointer;
  opacity:0;transition:opacity .16s var(--ease);font-size:14px;line-height:1;
}
.card:hover .navarrow,.navarrow:focus-visible{opacity:1}
.navarrow.prev{left:8px} .navarrow.next{right:8px}

.barra{display:flex;align-items:center;gap:8px;padding:12px 13px 0}
.barra .code{font-family:var(--ui);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}
.pill{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--ui);font-weight:600;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim-2);
}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal;flex:none}
.pill.aprovado{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.pill.ajuste{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.pill.reprovado{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.pill.publicado{color:var(--pub);border-color:var(--pub-line);background:var(--pub-bg)}

.acoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:12px 11px 0}
.ab{
  padding:9px 1px;border-radius:var(--r-sm);cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);color:var(--dim);
  font-size:10.5px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:3px;
  transition:border-color .16s var(--ease),color .16s var(--ease);
}
.ab:hover{color:var(--paper);border-color:var(--sage)}
.ab[aria-pressed="true"]{color:#0A1501;font-weight:700}
.ab.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.ab.warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.ab.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.ab.pub[aria-pressed="true"]{background:var(--pub);border-color:var(--pub);color:#061020}

.abrir{
  margin-top:12px;width:100%;text-align:left;cursor:pointer;
  padding:11px 13px;background:transparent;border:none;
  border-top:1px solid var(--line-soft);
  font-family:var(--ui);font-weight:600;font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim-2);display:flex;align-items:center;gap:7px;
  transition:color .16s var(--ease),background .16s var(--ease);
}
.abrir:hover{color:var(--paper);background:var(--surface-2)}
.abrir.tem{color:var(--gold)}
.abrir .seta{margin-left:auto;transition:transform .16s var(--ease);letter-spacing:0}
.card.aberta .abrir .seta{transform:rotate(180deg)}

.notas{padding:4px 13px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-soft)}
.lista{display:flex;flex-direction:column;gap:9px;max-height:220px;overflow-y:auto}
.notas .nota{display:flex;flex-direction:column;gap:3px}
.notas .nota .when{font-family:var(--ui);font-weight:500;color:var(--dim-2);font-size:9.5px;letter-spacing:.06em}
.notas .nota .body{
  background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:10px;border-top-left-radius:3px;
  padding:9px 12px;font-size:13px;line-height:1.5;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.notas .nota.sys .body{background:transparent;border-style:dashed;color:var(--dim);font-size:12px}
.notas .nota.pendente .when{color:var(--gold)}
.notas .nota.pendente .body{border-color:var(--gold-dim)}
.notas textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px 12px;font-size:13px;
  resize:vertical;min-height:70px;line-height:1.5;font-family:var(--sans);
}
.notas textarea:disabled{opacity:.4}
.rodape{display:flex;align-items:center;gap:8px}
.rodape .hint{font-family:var(--ui);font-weight:500;font-size:9.5px;letter-spacing:.06em;color:var(--dim-2)}
.env{
  margin-left:auto;background:var(--gold);border:none;color:var(--no-acento);
  font-weight:700;font-size:12.5px;padding:8px 17px;border-radius:999px;cursor:pointer;
}
.env:disabled{opacity:.4;cursor:not-allowed}

/* Volta para a escolha de produto. Fica na barra de seções, à direita:
   é o nível de navegação acima das seções, então é onde a pessoa procura. */
.home{
  margin-left:auto;align-self:center;
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--ui);font-weight:700;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;
  border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;background:transparent;
  transition:color .16s var(--ease),border-color .16s var(--ease),background .16s var(--ease);
}
.home:hover{color:var(--no-acento);background:var(--gold);border-color:var(--gold)}

/* ---------- criativos em vídeo ---------- */
.grid-video{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card.video .tela{
  position:relative;aspect-ratio:var(--video-prop,9/16);background:var(--ink-2);overflow:hidden;
}
.card.video .tela iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
}
/* O player do Drive só entra quando a pessoa pede. Trinta e nove players
   carregando juntos travavam a página; a miniatura tem ~18 KB. */
.card.video .tela.parado{cursor:pointer}
.card.video .tela img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card.video .play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;
  background:rgba(13,13,13,.62);backdrop-filter:blur(3px);
  border:1.5px solid rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;
  transition:background .16s var(--ease),transform .16s var(--ease);
}
.card.video .play::after{
  content:"";border-style:solid;border-width:9px 0 9px 15px;
  border-color:transparent transparent transparent #fff;margin-left:4px;
}
.card.video .tela.parado:hover .play{background:var(--gold);transform:translate(-50%,-50%) scale(1.06)}
.card.video .tela.parado:hover .play::after{border-left-color:var(--no-acento)}

/* ---------- páginas no ar ---------- */
#viewPaginas{max-width:var(--maxw-texto)}

.automacao{
  border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:var(--r);background:var(--surface);
  padding:14px 18px;margin:0 0 20px;font-size:13.5px;color:var(--dim);line-height:1.6;
}
.automacao b{color:var(--paper);font-weight:700}
.automacao.alerta{border-left-color:var(--warn)}
.automacao .ruim{color:var(--bad)}

.legenda{
  display:flex;gap:20px;flex-wrap:wrap;align-items:center;
  font-family:var(--ui);font-weight:500;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2);margin:0 0 26px;
}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.legenda i{width:9px;height:9px;border-radius:3px;font-style:normal;flex:none}
.legenda i.boa{background:var(--ok)} .legenda i.media{background:var(--warn)} .legenda i.ruim{background:var(--bad)}

.funil{margin:0 0 38px}
.funil-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:0 0 13px;border-bottom:1px solid var(--line)}
.funil-head h2{font-family:var(--disp);font-weight:600;font-size:21px;margin:0;letter-spacing:-.015em}
.funil-head .versao{color:var(--gold)}
.funil-head .meta{font-family:var(--ui);font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--dim-2);margin-left:auto;font-variant-numeric:tabular-nums}

/* Preview ao vivo da primeira página do funil, em celular. As 10 páginas de
   um funil são o mesmo template com a cidade trocada, então uma amostra já
   mostra o que está no ar — e mobile porque é de onde vem o tráfego e onde
   as notas são piores. Iframe em vez de screenshot: nunca desatualiza. */
/* No desktop o preview fica à esquerda e a lista à direita: dá para comparar
   a arte da página com as notas sem rolar a tela. Abaixo de 1100px empilha. */
.funil-corpo{
  display:grid;grid-template-columns:248px minmax(0,1fr);
  gap:32px;align-items:start;padding-top:22px;
}
.amostra{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.moldura{
  position:relative;flex:none;
  width:218px;height:392px;
  border:6px solid var(--surface-3);border-radius:26px;
  background:var(--ink-2);overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.40);
}
.moldura .aviso{
  position:absolute;inset:0;z-index:0;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim-2);padding:24px;
}
.moldura iframe{
  position:absolute;top:0;left:0;z-index:1;
  width:390px;height:701px;border:0;
  transform:scale(.5589);transform-origin:top left;
  pointer-events:none;background:var(--ink-2);
}
.amostra-txt{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:100%}
.amostra-txt .rot{
  font-family:var(--ui);font-weight:600;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim-2);
}
.amostra-txt h3{font-family:var(--disp);font-weight:600;font-size:20px;margin:0;letter-spacing:-.015em}
.amostra-txt .end{
  font-family:var(--mono);font-size:10.5px;color:var(--dim-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch;
}
.amostra-notas{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:4px}
.amostra-notas .par{display:flex;align-items:center;gap:8px}
.amostra-notas .cap{
  font-family:var(--ui);font-weight:600;font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dim-2);
}

.tabela-wrap{overflow-x:auto}
table.paginas{width:100%;border-collapse:collapse;font-size:14px;min-width:700px}
table.paginas th{
  font-family:var(--ui);font-weight:600;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim-2);
  text-align:left;padding:14px 12px 11px;white-space:nowrap;
}
table.paginas th.num{text-align:center;width:82px}
table.paginas td{padding:13px 12px;border-top:1px solid var(--line-soft);vertical-align:middle}
table.paginas tbody tr{transition:background .14s var(--ease)}
table.paginas tbody tr:hover{background:var(--surface)}
.cidade{display:flex;flex-direction:column;gap:3px;min-width:0}
.cidade b{font-weight:600;font-size:14px;letter-spacing:-.01em}
.cidade .slug{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36ch}
td.dia{font-family:var(--ui);font-weight:500;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
td.num{text-align:center}

/* nota do PageSpeed — no escopo da tabela, para não colidir com as anotações */
.nota-badge,
table.paginas .nota{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;padding:6px 10px;border-radius:var(--r-sm);
  font-family:var(--disp);font-weight:600;font-size:15px;
  font-variant-numeric:tabular-nums;border:1px solid;
}
.nota-badge.boa,
table.paginas .nota.boa{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.nota-badge.media,
table.paginas .nota.media{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.nota-badge.ruim,
table.paginas .nota.ruim{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.nota-badge.vazia,
table.paginas .nota.vazia{color:var(--dim-2);border-color:var(--line);background:transparent;font-weight:400}

/* Status da página é escolhido aqui, não vem da planilha: quem aprova
   mexe no painel, e a escolha fica no banco como as dos criativos. */
.sel-status{
  appearance:none;-webkit-appearance:none;
  font-family:var(--ui);font-weight:600;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 26px 5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--dim-2);
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%, calc(100% - 10px) 52%;
  background-size:4px 4px, 4px 4px;background-repeat:no-repeat;
  transition:color .16s var(--ease),border-color .16s var(--ease),background-color .16s var(--ease);
}
.sel-status:hover{border-color:var(--sage)}
.sel-status option{background:var(--surface-2);color:var(--paper);letter-spacing:0}
.sel-status.aprovado{color:var(--ok);border-color:var(--ok-line);background-color:var(--ok-bg)}
.sel-status.publicado{color:var(--pub);border-color:var(--pub-line);background-color:var(--pub-bg)}

.fonte{font-family:var(--ui);font-weight:500;font-size:10px;letter-spacing:.06em;color:var(--dim-2);white-space:nowrap}
.fonte.real{color:var(--ok)}
.fonte.local{color:var(--gold)}

.abrir-pg{
  font-family:var(--ui);font-weight:600;font-size:10.5px;letter-spacing:.08em;
  color:var(--dim);text-decoration:none;white-space:nowrap;
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;display:inline-block;
  transition:color .16s var(--ease),border-color .16s var(--ease);
}
.abrir-pg:hover{color:var(--gold);border-color:var(--gold-dim)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:60;background:rgba(6,12,2,.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:30px}
.lb.on{display:flex}
.lb img{max-width:min(96vw,920px);max-height:82vh;object-fit:contain;border-radius:8px}
.lb .lbbar{display:flex;gap:10px;align-items:center;font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--dim)}
.lb .lbbar button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--paper)}
.lb .lbbar button:hover{border-color:var(--sage)}

@media (max-width:1100px){
  .funil-corpo{grid-template-columns:minmax(0,1fr);gap:24px}
  .amostra{flex-direction:row;align-items:center;gap:26px;flex-wrap:wrap}
}
@media (max-width:760px){
  .top{padding-top:24px;padding-bottom:20px;gap:20px}
  .tally{margin-left:0;width:100%}
  .tally .t{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

      {id:"turne-mdv-brasilia-v5", cidade:"Brasília (DF)", data:"14/10", status:"Aprovado", mobile:null, desktop:null, url:"https://turnemaquinadevendas.com.br/turne-mdv-brasilia-v5/"},
      {id:"turne-mdv-manaus-v5", cidade:"Manaus (AM)", data:"26/10", status:"Aprovado", mobile:null, desktop:null, url:"https://turnemaquinadevendas.com.br/turne-mdv-manaus-v5/"},
      {id:"turne-mdv-belem-v5", cidade:"Belém (PA)", data:"27/10", status:"Aprovado", mobile:null, desktop:null, url:"https://turnemaquinadevendas.com.br/turne-mdv-belem-v5/"},
      {id:"turne-mdv-sinop-v5", cidade:"Sinop (MT)", data:"28/10", status:"Aprovado", mobile:null, desktop:null, url:"https://turnemaquinadevendas.com.br/turne-mdv-sinop-v5/"},
      {id:"turne-mdv-cuiaba-v5", cidade:"Cuiabá (MT)", data:"29/10", status:"Aprovado", mobile:null, desktop:null, url:"https://turnemaquinadevendas.com.br/turne-mdv-cuiaba-v5/"},
      {id:"turne-mdv-ribeiraopreto-v5", cidade:"Ribeirão Preto (SP)", data:"30/10", status:"Aprovado", mobile:null, desktop:null, url:"https://turnemaquinadevendas.com.br/turne-mdv-ribeiraopreto-v5/"}
    ]}
  ];
  /* FUNIS:fim */

  var LABEL = {pendente:"pendente",aprovado:"aprovado",ajuste:"ajustar",
               reprovado:"reprovado",publicado:"publicado"};

  // estado
  var status   = {};     // arteKey -> {status, em, remessa}
  var notas    = [];     // {id, arteKey, remessa, texto, criadoEm}
  var lote     = "r01";   // abre na primeira remessa que tem artes
  var filtro   = "todas";
  var filtroV  = "todas";   // filtro da aba de vídeo
  var slide    = {};     // arteKey -> índice do card do carrossel
  var aberta   = null;   // arteKey com o bloco de anotações aberto
  var tocando  = {};     // vídeos cujo player já foi pedido nesta visita
  var rascunho = {};     // arteKey -> texto ainda não enviado
  var focado   = false;  // o textarea estava com o cursor antes de repintar
  var lbArte = null, lbIdx = 0;

  var secao = "criativos";   // "criativos" | "paginas"

  /* medições automáticas do PageSpeed, quando existirem: id da página ->
     {mobile:{nota,campo,temCampo}, desktop:{...}, medidoEm}. Vazio = o painel
     mostra o que está na planilha. */
  var medicoes = {};
  var execucao = null;       // como foi a última rodada automática

  var $ = function(s){ return document.querySelector(s); };
  var grid = $("#grid"), tally = $("#tally"), tabs = $("#tabs");

  function remessaAtual(){
    for(var i=0;i<REMESSAS.length;i++){ if(REMESSAS[i].id === lote) return REMESSAS[i]; }
    return REMESSAS[0];
  }
  function artesDoLote(){ return remessaAtual().artes; }

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  function quando(iso){
    var d = new Date(iso);
    if(isNaN(d)) return "";
    var hh = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    if(d.toDateString() === new Date().toDateString()) return "hoje " + hh;
    return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + " " + hh;
  }

  function st(key){ return (status[key] && status[key].status) || "pendente"; }
  function notasDe(key){ return notas.filter(function(n){ return n.arteKey === key; }); }
  /* A anotação guarda a remessa crua ("r01"), que se repete entre produtos —
     quem diz o produto é a arteKey, que vem prefixada. Sem esse filtro, o
     contador do lote somava anotação de produto alheio. */
  function notasDoLote(id){
    var pre = produto + ":";
    return notas.filter(function(n){
      return n.remessa === id && String(n.arteKey || "").indexOf(pre) === 0;
    });
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  // ---------- render ----------
  function renderTabs(){
    tabs.innerHTML = REMESSAS.map(function(r){
      var n = r.artes.length;
      var ativo = r.id === lote;
      var meta;
      if(!n){
        meta = "aguardando artes";
      }else{
        var ok = r.artes.filter(function(a){ return st(a.key) === "aprovado"; }).length;
        meta = ok + "/" + n + " aprovadas";
      }
      var sinal = n && notasDoLote(r.id).length > 0 && !ativo;
      return '<button class="tab'+(n?"":" vazia")+'" role="tab" data-lote="'+r.id+'" aria-selected="'+ativo+'">' +
        (sinal ? '<span class="sinal" title="tem anotações"></span>' : '') +
        '<span class="tl">'+r.nome+'</span>' +
        '<span class="tm">'+meta+'</span>' +
      '</button>';
    }).join("");
  }

  function blocoNotas(a){
    var lista = notasDe(a.key).slice().sort(function(x,y){
      return String(x.criadoEm).localeCompare(String(y.criadoEm));
    });

    var itens = "";
    if(status[a.key] && status[a.key].status && status[a.key].status !== "pendente"){
      itens += '<div class="nota sys"><div class="body">Marcada como <b>' +
               LABEL[status[a.key].status] + '</b> · ' + quando(status[a.key].em) + '</div></div>';
    }
    itens += lista.map(function(n){
      return '<div class="nota'+(n.pendente?" pendente":"")+'">' +
        '<span class="when">'+quando(n.criadoEm)+(n.pendente?" · enviando…":"")+'</span>' +
        '<div class="body">'+esc(n.texto)+'</div>' +
      '</div>';
    }).join("");

    if(!itens) itens = '<p class="nota sys"><span class="body">Nenhuma anotação ainda.</span></p>';

    return '<div class="notas">' +
      '<div class="lista">'+itens+'</div>' +
      '<textarea data-msg aria-label="Anotação para '+a.code+'"></textarea>' +
      '<div class="rodape">' +
        '<span class="hint">⌘/Ctrl + Enter envia</span>' +
        '<button type="button" class="env" data-anotar>Anotar</button>' +
      '</div>' +
    '</div>';
  }

  function renderGrid(){
    var lista = artesDoLote();

    if(!lista.length){
      grid.innerHTML = '<div class="vazio">' +
        '<strong>' + esc(remessaAtual().nome) + ' ainda não tem artes</strong>' +
        '<span>Quando as artes chegarem, elas entram aqui do mesmo jeito: versão feed, ' +
        'status e anotações próprios. A aba guarda a aprovação separada das outras remessas.</span>' +
        '<code>Downloads / demanda campina grande</code>' +
      '</div>';
      return;
    }

    var visiveis = lista.filter(function(a){
      if(filtro === "todas") return true;
      if(filtro === "comentadas") return notasDe(a.key).length > 0;
      return st(a.key) === filtro;
    });

    if(!visiveis.length){
      grid.innerHTML = '<div class="vazio"><strong>Nenhuma arte neste filtro</strong>' +
        '<span>Volte para “Todas” para ver as ' + lista.length + ' artes da ' +
        esc(remessaAtual().nome.toLowerCase()) + '.</span></div>';
      return;
    }

    grid.innerHTML = visiveis.map(function(a){
      var s = st(a.key);
      var n = notasDe(a.key).length;
      var i = slide[a.key] || 0;
      var car = a.tipo === "CAR";
      var open = aberta === a.key;

      return '<article class="card'+(open?" aberta":"")+'" data-key="'+a.key+'" data-st="'+s+'">' +
        '<div class="shot" data-zoom role="button" tabindex="0" aria-label="Ver '+a.code+' em tamanho grande">' +
          '<img src="'+a.files[i]+'" alt="Arte '+a.code+(car?" card "+(i+1):"")+'" loading="lazy">' +
          '<div class="tagline">' +
            '<span class="tag">'+a.code+'</span>' +
            (car ? '<span class="tag car">carrossel '+(i+1)+'/'+a.files.length+'</span>' : '') +
          '</div>' +
          (car ? '<button class="navarrow prev" data-nav="-1" aria-label="Card anterior">‹</button>' +
                 '<button class="navarrow next" data-nav="1" aria-label="Próximo card">›</button>' : '') +
        '</div>' +

        '<div class="barra">' +
          '<span class="code">'+(car?a.files.length+" cards · feed":"feed")+'</span>' +
          '<span class="pill '+(s!=="pendente"?s:"")+'"><i></i>'+LABEL[s]+'</span>' +
        '</div>' +

        '<div class="acoes">' +
          '<button class="ab ok"   data-v="aprovado"  aria-pressed="'+(s==="aprovado")+'">Aprovar</button>' +
          '<button class="ab warn" data-v="ajuste"    aria-pressed="'+(s==="ajuste")+'">Ajustar</button>' +
          '<button class="ab bad"  data-v="reprovado" aria-pressed="'+(s==="reprovado")+'">Reprovar</button>' +
          '<button class="ab pub"  data-v="publicado" aria-pressed="'+(s==="publicado")+'">Publicado</button>' +
        '</div>' +

        '<button class="abrir'+(n?" tem":"")+'" data-abrir aria-expanded="'+open+'">' +
          '<span>✎ '+(n ? n + (n===1?" anotação":" anotações") : "Anotar")+'</span>' +
          '<span class="seta">⌄</span>' +
        '</button>' +

        (open ? blocoNotas(a) : "") +
      '</article>';
    }).join("");

    devolverRascunho();
  }

  /* depois de repintar, devolve o texto não enviado (e o cursor) à caixa */
  function devolverRascunho(){
    if(!aberta) return;
    var ta = document.querySelector('.card[data-key="'+aberta+'"] textarea[data-msg]');
    if(!ta) return;
    ta.value = rascunho[aberta] || "";
    if(focado){
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }

  function tile(cls,n,l){
    return '<div class="t '+cls+'"><span class="n">'+n+'</span><span class="l">'+l+'</span></div>';
  }
  function doisDigitos(n){ return String(n).padStart(2,"0"); }

  function renderCabecalho(){
    var live = '<span class="live" id="live"><span class="bulb"></span><span id="liveTxt"></span></span>';

    if(secao === "criativos"){
      var lista = artesDoLote();
      var r = remessaAtual();
      $("#titulo").innerHTML =
        '<span>Criativos em Imagem</span><span class="sep">—</span>' +
        '<span class="lote">' + esc(r.nome) + '</span>' +
        (r.drive || PRODUTOS[produto].drive
          ? '<a class="btn-drive" href="' + esc(r.drive || PRODUTOS[produto].drive) + '" target="_blank" rel="noopener noreferrer">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 3h7.6l5.2 9-3.8 6.6H7.4L3.6 12z"/></svg>' +
            'Acessar pasta do Drive</a>'
          : '');
      $("#subline").innerHTML =
        '<span><b>' + lista.length + '</b> artes</span><span class="dot">/</span>' +
        '<span>versão <b>Feed</b> · 1080 × 1350</span><span class="dot">/</span>' + live;

      var c = {pendente:0,aprovado:0,ajuste:0,reprovado:0,publicado:0};
      lista.forEach(function(a){ c[st(a.key)]++; });
      tally.innerHTML =
        tile("", doisDigitos(c.pendente), "pendentes") +
        tile("is-ok", doisDigitos(c.aprovado), "aprovadas") +
        tile("is-warn", doisDigitos(c.ajuste), "ajustar") +
        tile("is-bad", doisDigitos(c.reprovado), "reprovadas") +
        tile("is-pub", doisDigitos(c.publicado), "publicadas") +
        tile("", doisDigitos(notasDoLote(lote).length), "anotações");
    }else if(secao === "videos"){
      var todos = [];
      VIDEOS.forEach(function(g){ todos = todos.concat(g.videos); });
      var c2 = {pendente:0,aprovado:0,ajuste:0,reprovado:0,publicado:0};
      todos.forEach(function(v){ c2[st(chaveVideo(v))]++; });
      var notasVideo = notas.filter(function(n){
        return String(n.arteKey || "").indexOf(produto + ":vd__") === 0;
      }).length;

      $("#titulo").innerHTML = '<span>Criativos em Vídeo</span>';
      $("#subline").innerHTML =
        '<span><b>' + todos.length + '</b> vídeos</span><span class="dot">/</span>' +
        '<span><b>' + VIDEOS.length + '</b> tipos</span><span class="dot">/</span>' +
        '<span>versão <b>' + fv().nome + '</b> · ' + fv().proporcao + '</span>' + '<span class="dot">/</span>' + live;

      tally.innerHTML =
        tile("", doisDigitos(c2.pendente), "pendentes") +
        tile("is-ok", doisDigitos(c2.aprovado), "aprovados") +
        tile("is-warn", doisDigitos(c2.ajuste), "ajustar") +
        tile("is-bad", doisDigitos(c2.reprovado), "reprovados") +
        tile("is-pub", doisDigitos(c2.publicado), "publicados") +
        tile("", doisDigitos(notasVideo), "anotações");
    }else{
      var todas = [];
      FUNIS.forEach(function(f){ todas = todas.concat(f.paginas); });
      var comMobile  = todas.filter(function(p){ return p.mobile  != null; });
      var comDesktop = todas.filter(function(p){ return p.desktop != null; });

      $("#titulo").innerHTML = '<span>Páginas no ar</span>';
      $("#subline").innerHTML =
        '<span><b>' + todas.length + '</b> páginas</span><span class="dot">/</span>' +
        '<span><b>' + FUNIS.length + '</b> funis</span><span class="dot">/</span>' +
        '<span>outubro 2026</span><span class="dot">/</span>' + live;

      tally.innerHTML =
        tile("", todas.length, "páginas") +
        tile("", comMobile.length + "/" + todas.length, "medidas") +
        notaTile(media(comMobile, "mobile"), "méd. mobile") +
        notaTile(media(comDesktop, "desktop"), "méd. desktop");
    }

    pintarLive();   // o indicador é recriado junto com a subline

    function media(lista, campo){
      if(!lista.length) return null;
      var soma = lista.reduce(function(t,p){ return t + p[campo]; }, 0);
      return Math.round(soma / lista.length);
    }
    function notaTile(v, rotulo){
      if(v == null) return tile("", "—", rotulo);
      return tile(faixa(v) === "boa" ? "is-ok" : faixa(v) === "media" ? "is-warn" : "is-bad", v, rotulo);
    }
  }

  /* Teto de 95: nota 100 no laboratório é ilusória — a mesma página que
     pontua 100 entrega AVERAGE no dado de campo. Aplicado também na
     gravação; aqui é rede de segurança para número vindo da planilha. */
  var TETO = 95;
  function limitar(n){ return typeof n === "number" ? Math.min(TETO, n) : n; }

  /* faixas do PageSpeed: 90+ bom, 50-89 precisa melhorar, abaixo ruim */
  function faixa(n){ return n >= 90 ? "boa" : n >= 50 ? "media" : "ruim"; }


  /* "há 2d", "há 5h" — para dizer quando a nota foi tirada */
  function desdeQuando(iso){
    var t = new Date(iso).getTime();
    if(isNaN(t)) return "";
    var min = Math.round((Date.now() - t) / 60000);
    if(min < 60) return "há " + Math.max(min,1) + "min";
    if(min < 1440) return "há " + Math.round(min/60) + "h";
    return "há " + Math.round(min/1440) + "d";
  }

  /* Status da página: escolhido no painel e guardado no banco, junto com as
     decisões dos criativos. "em aprovação" é o ponto de partida de todas. */
  var ETAPAS = [
    {v:"aprovacao", r:"Em aprovação"},
    {v:"aprovado",  r:"Aprovado"},
    {v:"publicado", r:"Publicado"}
  ];
  function etapaDe(p){
    var e = (status[chavePagina(p)] || {}).status;
    return ETAPAS.some(function(x){ return x.v === e; }) ? e : "aprovacao";
  }

  /* a nota que vale: a medida automaticamente, se houver; senão a da planilha */
  function notaVigente(p, qual){
    var m = medicoes[p.id];
    if(m && m[qual] && typeof m[qual].nota === "number"){
      return {
        valor: limitar(m[qual].nota),
        deOnde: "medida",
        campo: Boolean(m[qual].temCampo),
        local: m.origem === "local",   // Lighthouse rodado na mão, não o PageSpeed
        amostras: m[qual].amostras || null,
        quando: m.medidoEm
      };
    }
    return {valor:limitar(p[qual]), deOnde:"planilha", campo:false, local:false,
            amostras:null, quando:null};
  }

  function renderAutomacao(){
    var el = $("#automacao");
    if(!execucao){
      el.className = "automacao";
      el.innerHTML = '<b>Medição automática a cada 12 horas.</b> ' +
        'Ainda não rodou — até lá as notas são as da planilha.';
      return;
    }
    if(execucao.erro){
      el.className = "automacao alerta";
      el.innerHTML = '<b>A medição automática não rodou.</b> ' + esc(execucao.erro) +
        ' Enquanto isso, as notas são as da planilha.';
      return;
    }
    el.className = "automacao";
    el.innerHTML = '<b>Medição automática a cada 12 horas.</b> Cada página é medida ' +
      '3 vezes em mobile e desktop, e vale a melhor das três — sem guardar ' +
      'recorde: o número é o da rodada mais recente. Última ' + desdeQuando(execucao.quando) +
      ' · ' + execucao.medidas + ' páginas' +
      (execucao.comErro ? ' · <span class="ruim">' + execucao.comErro + ' falharam</span>' : '') + '.';
  }

  function renderPaginas(){
    renderAutomacao();

    $("#funis").innerHTML = FUNIS.map(function(f){
      var n = f.paginas.length;
      var mob  = f.paginas.filter(function(p){ return notaVigente(p,"mobile").valor  != null; }).length;
      var desk = f.paginas.filter(function(p){ return notaVigente(p,"desktop").valor != null; }).length;
      var meta = (mob + desk) === 0
        ? n + " páginas · sem medição"
        : n + " páginas · mobile " + mob + "/" + n + " · desktop " + desk + "/" + n;

      return '<section class="funil">' +
        '<div class="funil-head">' +
          '<h2>' + esc(f.nome) + ' <span class="versao">' + esc(f.versao) + '</span></h2>' +
          '<span class="meta">' + meta + '</span>' +
        '</div>' +
        '<div class="funil-corpo">' +
        amostra(f) +
        '<div class="tabela-wrap"><table class="paginas">' +
          '<thead><tr>' +
            '<th>Cidade</th><th>Evento</th><th>Status</th>' +
            '<th class="num">Mobile</th><th class="num">Desktop</th>' +
            '<th>Medição</th><th></th>' +
          '</tr></thead><tbody>' +
          f.paginas.map(function(p){
            var m = notaVigente(p,"mobile"), d = notaVigente(p,"desktop");
            return '<tr>' +
              '<td><span class="cidade"><b>' + esc(p.cidade) + '</b>' +
                '<span class="slug" title="' + esc(p.url) + '">' + esc(slug(p.url)) + '</span></span></td>' +
              '<td class="dia">' + esc(p.data) + '</td>' +
              '<td>' + seletor(p) + '</td>' +
              '<td class="num">' + nota(m) + '</td>' +
              '<td class="num">' + nota(d) + '</td>' +
              '<td>' + origem(m, d) + '</td>' +
              '<td><a class="abrir-pg" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">abrir ↗</a></td>' +
            '</tr>';
          }).join("") +
        '</tbody></table></div>' +
        '</div>' +
      '</section>';
    }).join("");

    /* Preview da página com a melhor nota do funil. As 10 são o mesmo
       template com a cidade trocada, então qualquer uma mostra o layout —
       e escolhendo a de melhor desempenho o preview vira a referência do
       que o funil entrega quando está no seu melhor. */
    function melhorPagina(f){
      var pontuada = f.paginas.map(function(p){
        var m = notaVigente(p,"mobile"), d = notaVigente(p,"desktop");
        return {p:p, mob: m.valor == null ? -1 : m.valor, desk: d.valor == null ? -1 : d.valor};
      });
      pontuada.sort(function(a,b){ return (b.mob - a.mob) || (b.desk - a.desk); });
      return pontuada.length ? pontuada[0].p : null;
    }

    function amostra(f){
      var p = melhorPagina(f);
      if(!p) return "";
      var m = notaVigente(p,"mobile"), d = notaVigente(p,"desktop");
      var selo = function(n){
        if(n.valor == null) return '<span class="nota-badge vazia">—</span>';
        return '<span class="nota-badge ' + faixa(n.valor) + '">' + n.valor + '</span>';
      };
      return '<div class="amostra">' +
        '<div class="moldura">' +
          '<div class="aviso">pré-visualização indisponível aqui</div>' +
          '<iframe src="' + esc(p.url) + '" tabindex="-1" ' +
            'title="Pré-visualização de ' + esc(p.cidade) + '" ' +
            'sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>' +
        '</div>' +
        '<div class="amostra-txt">' +
          '<span class="rot">Melhor nota do funil · preview mobile</span>' +
          '<h3>' + esc(p.cidade) + '</h3>' +
          '<span class="end">' + esc(slug(p.url)) + '</span>' +
          '<div class="amostra-notas">' +
            '<span class="par"><span class="cap">Mobile</span>' + selo(m) + '</span>' +
            '<span class="par"><span class="cap">Desktop</span>' + selo(d) + '</span>' +
          '</div>' +
          '<a class="abrir-pg" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer" ' +
            'style="align-self:flex-start;margin-top:6px">abrir a página ↗</a>' +
        '</div>' +
      '</div>';
    }

    /* A nota é a melhor das 3 medições da rodada mais recente. Sem recorde
       histórico: com medição de 12 em 12 horas, guardar a maior de sempre
       empurrava toda página para o teto e o painel virava uma fileira de 95. */
    function nota(n){
      if(n.valor == null) return '<span class="nota vazia" title="ainda não medida">—</span>';
      var dica = n.amostras && n.amostras.length > 1
        ? "melhor de " + n.amostras.length + " medições: " + n.amostras.join(", ")
        : "";
      return '<span class="nota ' + faixa(n.valor) + '"' +
        (dica ? ' title="' + dica + '"' : '') + '>' + n.valor + '</span>';
    }

    function seletor(p){
      var atual = etapaDe(p);
      return '<select class="sel-status ' + atual + '" data-pg="' + esc(p.id) + '" ' +
        'aria-label="Status de ' + esc(p.cidade) + '">' +
        ETAPAS.map(function(e){
          return '<option value="' + e.v + '"' + (e.v === atual ? " selected" : "") + '>' + e.r + '</option>';
        }).join("") +
      '</select>';
    }

    /* de onde veio a nota: medição automática (com ou sem dado de visitantes
       reais) ou o número digitado na planilha */
    function origem(m, d){
      if(m.deOnde !== "medida" && d.deOnde !== "medida"){
        return '<span class="fonte">planilha</span>';
      }
      var quando = desdeQuando(m.quando || d.quando);
      var real = m.campo || d.campo;
      var rotulo, classe, explica;

      if(m.local || d.local){
        rotulo = "local";
        classe = " local";
        explica = "Lighthouse rodado na máquina, não o PageSpeed. Mede a mesma coisa, mas em outro hardware — a nota pode variar alguns pontos.";
      }else if(real){
        rotulo = "no ar";
        classe = " real";
        explica = "inclui dados de visitantes reais (CrUX)";
      }else{
        rotulo = "teste";
        classe = "";
        explica = "teste em laboratório; a página ainda não tem visitas suficientes para o dado real";
      }
      return '<span class="fonte' + classe + '" title="' + explica + '">' +
        quando + ' · ' + rotulo + '</span>';
    }
    function slug(u){
      return String(u).trim().replace(/^https?:\/\/[^/]+\//, "").replace(/\/$/, "");
    }
  }

  /* Formato dos vídeos do produto aberto. A Turnê e a MQV Online mandam
     feed (4:5); o RGV, stories (9:16). */
  function fv(){
    return (PRODUTOS[produto] || {}).formatoVideo
        || {nome:"Stories", proporcao:"9 : 16", css:"9/16"};
  }

  /* Card de vídeo: o player vem do Drive por embed. A proporção sai do
     formato que o produto entrega. */
  function cardVideo(v){
    var chave = chaveVideo(v);
    var e = st(chave);
    var n = notasDe(chave).length;
    var open = aberta === chave;

    return '<article class="card video' + (open?" aberta":"") + '" data-key="'+chave+'" data-st="'+e+'">' +
      (tocando[chave]
        ? '<div class="tela">' +
            '<iframe src="https://drive.google.com/file/d/'+esc(v.drive)+'/preview" ' +
              'allow="autoplay" title="'+esc(v.code)+' · '+esc(v.tipo)+'"></iframe>' +
          '</div>'
        : '<div class="tela parado" data-play role="button" tabindex="0" ' +
            'aria-label="Reproduzir '+esc(v.code)+' · '+esc(v.tipo)+'">' +
            '<img src="https://drive.google.com/thumbnail?id='+esc(v.drive)+'&sz=w400" ' +
              'alt="Primeiro quadro de '+esc(v.code)+'" loading="lazy">' +
            /* o Drive leva um tempo para gerar o quadro de capa de um vídeo
               recém-subido, e até lá manda um retângulo branco. Sem o código
               na frente, os cartões ficam indistinguíveis. */
            '<div class="tagline"><span class="tag">'+esc(v.code)+'</span></div>' +
            '<span class="play"></span>' +
          '</div>') +
      '<div class="barra">' +
        '<span class="code">' + fv().nome.toLowerCase() + '</span>' +
        '<span class="pill '+(e!=="pendente"?e:"")+'"><i></i>'+LABEL[e]+'</span>' +
      '</div>' +
      '<div class="acoes">' +
        '<button class="ab ok"   data-v="aprovado"  aria-pressed="'+(e==="aprovado")+'">Aprovar</button>' +
        '<button class="ab warn" data-v="ajuste"    aria-pressed="'+(e==="ajuste")+'">Ajustar</button>' +
        '<button class="ab bad"  data-v="reprovado" aria-pressed="'+(e==="reprovado")+'">Reprovar</button>' +
        '<button class="ab pub"  data-v="publicado" aria-pressed="'+(e==="publicado")+'">Publicado</button>' +
      '</div>' +
      '<button class="abrir'+(n?" tem":"")+'" data-abrir aria-expanded="'+open+'">' +
        '<span>✎ '+(n ? n + (n===1?" anotação":" anotações") : "Anotar")+'</span>' +
        '<span class="seta">⌄</span>' +
      '</button>' +
      (open ? blocoNotas({key:chave, code:v.code}) : "") +
    '</article>';
  }

  function renderVideos(){
    var cai = function(v){
      var chave = chaveVideo(v);
      if(filtroV === "todas") return true;
      if(filtroV === "comentadas") return notasDe(chave).length > 0;
      return st(chave) === filtroV;
    };

    var html = VIDEOS.map(function(g){
      var vis = g.videos.filter(cai);
      if(!vis.length) return "";
      var aprovados = g.videos.filter(function(v){ return st(chaveVideo(v)) === "aprovado"; }).length;
      return '<section class="funil">' +
        '<div class="funil-head">' +
          '<h2>' + esc(g.tipo) + '</h2>' +
          '<span class="meta">' + g.videos.length + ' vídeos · ' + aprovados + ' aprovados</span>' +
        '</div>' +
        '<div class="grid grid-video">' + vis.map(cardVideo).join("") + '</div>' +
      '</section>';
    }).join("");

    $("#tipos").innerHTML = html ||
      '<div class="vazio"><strong>Nenhum vídeo neste filtro</strong>' +
      '<span>Volte para “Todos” para ver os ' + totalVideos() + ' criativos.</span></div>';

    devolverRascunho();
  }

  function totalVideos(){
    return VIDEOS.reduce(function(t,g){ return t + g.videos.length; }, 0);
  }

  function renderSecoes(){
    Array.prototype.forEach.call(document.querySelectorAll(".sec"), function(b){
      b.setAttribute("aria-selected", String(b.dataset.s === secao));
    });
    (tabs.parentElement || tabs).hidden = secao !== "criativos";
    $("#viewCriativos").hidden = secao !== "criativos";
    $("#viewVideos").hidden = secao !== "videos";
    $("#viewPaginas").hidden = secao !== "paginas";

    $("#qtCri").textContent = REMESSAS.reduce(function(t,r){ return t + r.artes.length; }, 0);
    $("#qtVid").textContent = totalVideos();
    $("#qtPag").textContent = FUNIS.reduce(function(t,f){ return t + f.paginas.length; }, 0);
  }

  function renderEscolha(){
    $("#produtos").innerHTML = ORDEM_PRODUTOS.map(function(id){
      var p = PRODUTOS[id];
      return '<button class="produto" data-produto="'+id+'">' +
        '<img src="'+p.capa+'" alt="'+esc(p.nome)+'">' +
        '<span class="faixa"><b>'+esc(p.nome)+'</b><span class="ir">abrir →</span></span>' +
      '</button>';
    }).join("");
  }

  /* alterna entre a tela de escolha e o painel do produto */
  function renderModo(){
    var escolhendo = !produto;
    document.documentElement.setAttribute("data-produto", produto || "");
    $("#escolha").hidden = !escolhendo;
    ["#barraSecoes", ".top", "#viewCriativos", "#viewVideos", "#viewPaginas"].forEach(function(sel){
      var el = document.querySelector(sel);
      if(el) el.hidden = escolhendo;
    });
    if(!escolhendo){
      (document.querySelector(".tabs") || {}).hidden = escolhendo;
      $("#nomeProduto").textContent = PRODUTOS[produto].nome;
    }
  }

  function renderAll(){
    renderModo();
    if(!produto){ renderEscolha(); return; }
    renderSecoes();
    renderCabecalho();
    if(secao === "criativos"){ renderTabs(); renderGrid(); }
    else if(secao === "videos"){ renderVideos(); }
    else{ renderPaginas(); }
  }

  // ---------- interações ----------
  $("#produtos").addEventListener("click", function(e){
    var b = e.target.closest(".produto");
    if(!b) return;
    carregarProduto(b.dataset.produto);
    renderAll();
    window.scrollTo({top:0, behavior:"instant"});
  });

  $("#home").addEventListener("click", function(){
    produto = null;
    lsSet("mv_produto", "");
    renderAll();
    window.scrollTo({top:0, behavior:"instant"});
  });

  $("#secoes").addEventListener("click", function(e){
    var b = e.target.closest(".sec");
    if(!b || b.dataset.s === secao) return;
    secao = b.dataset.s;
    aberta = null; focado = false;
    renderAll();
    window.scrollTo({top:0, behavior:"instant"});
  });

  tabs.addEventListener("click", function(e){
    var b = e.target.closest(".tab");
    if(!b || b.dataset.lote === lote) return;
    lote = b.dataset.lote;
    filtro = "todas";
    aberta = null; focado = false;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
      c.setAttribute("aria-pressed", String(c.dataset.f === "todas"));
    });
    renderAll();
  });

  $("#funis").addEventListener("change", function(e){
    var sel = e.target.closest(".sel-status");
    if(!sel) return;
    var chave = "pg__" + sel.dataset.pg;
    var reg = {status:sel.value, em:new Date().toISOString(), remessa:"paginas"};
    status[chave] = reg;
    sel.className = "sel-status " + sel.value;
    gravarStatus(chave, reg);
  });

  $("#filters").addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if(!b) return;
    filtro = b.dataset.f;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
      c.setAttribute("aria-pressed", String(c === b));
    });
    renderGrid();
  });

  /* Os cartões de imagem e de vídeo têm os mesmos controles, então os
     handlers são ligados às duas grades. */
  function ligarCartoes(raiz){
    raiz.addEventListener("click", function(e){
      var card = e.target.closest(".card");
      if(!card) return;
      var key = card.dataset.key, a = BY_KEY[key];

      var nav = e.target.closest("[data-nav]");
      if(nav && a){
        e.stopPropagation();
        slide[key] = ((slide[key] || 0) + Number(nav.dataset.nav) + a.files.length) % a.files.length;
        renderGrid(); renderRail && renderRail();
        return;
      }
      if(a && e.target.closest("[data-zoom]")){ abrirLb(key, slide[key] || 0); return; }

      if(e.target.closest("[data-play]")){ tocando[key] = true; renderVideos(); return; }

      var dec = e.target.closest(".ab");
      if(dec){ decidir(key, dec.dataset.v); return; }

      if(e.target.closest("[data-abrir]")){
        var fechando = aberta === key;
        aberta = fechando ? null : key;
        focado = !fechando;
        repintarCartoes();
        return;
      }
      if(e.target.closest("[data-anotar]")){ enviarNota(key); return; }
    });

    raiz.addEventListener("keydown", function(e){
      var play = e.target.closest("[data-play]");
      if(play && (e.key === "Enter" || e.key === " ")){
        e.preventDefault();
        tocando[e.target.closest(".card").dataset.key] = true;
        renderVideos();
        return;
      }
      var zoom = e.target.closest("[data-zoom]");
      if(zoom && (e.key === "Enter" || e.key === " ")){
        e.preventDefault();
        var k = e.target.closest(".card").dataset.key;
        abrirLb(k, slide[k] || 0);
        return;
      }
      if(e.target.matches("textarea[data-msg]") && (e.metaKey || e.ctrlKey) && e.key === "Enter"){
        e.preventDefault();
        enviarNota(e.target.closest(".card").dataset.key);
      }
    });

    raiz.addEventListener("input", function(e){
      if(!e.target.matches("textarea[data-msg]")) return;
      rascunho[e.target.closest(".card").dataset.key] = e.target.value;
    });
    raiz.addEventListener("focusin", function(e){
      if(e.target.matches("textarea[data-msg]")) focado = true;
    });
    raiz.addEventListener("focusout", function(e){
      if(e.target.matches("textarea[data-msg]")) focado = false;
    });
  }

  ligarCartoes(grid);
  ligarCartoes($("#tipos"));

  /* repinta só a grade da seção aberta */
  function repintarCartoes(){
    if(secao === "videos") renderVideos(); else renderGrid();
  }

  $("#filtrosVideo").addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if(!b) return;
    filtroV = b.dataset.fv;
    Array.prototype.forEach.call($("#filtrosVideo").querySelectorAll(".chip"), function(c){
      c.setAttribute("aria-pressed", String(c === b));
    });
    renderVideos();
  });

  /* a chave diz de onde o item é: arte de remessa, vídeo ou página */
  function origemDaChave(key){
    if(BY_KEY[key]) return BY_KEY[key].remessa;
    if(String(key).indexOf("vd__") === 0) return "videos";
    if(String(key).indexOf("pg__") === 0) return "paginas";
    return null;
  }

  function decidir(key, valor){
    var novo = (st(key) === valor) ? "pendente" : valor;
    var reg = {status:novo, em:new Date().toISOString(), remessa:origemDaChave(key)};
    status[key] = reg;
    renderAll();
    gravarStatus(key, reg);
  }

  function enviarNota(key){
    var texto = (rascunho[key] || "").trim();
    if(!texto) return;
    var nota = {
      arteKey: key,
      remessa: origemDaChave(key),
      texto: texto,
      criadoEm: new Date().toISOString()
    };
    rascunho[key] = "";
    gravarNota(nota);
  }

  // ---------- lightbox ----------
  function abrirLb(key, i){
    lbArte = BY_KEY[key]; lbIdx = i;
    pintarLb();
    $("#lb").classList.add("on");
    $("#lbClose").focus();
  }
  function pintarLb(){
    $("#lbImg").src = lbArte.files[lbIdx];
    $("#lbImg").alt = "Arte " + lbArte.code;
    $("#lbCap").textContent = lbArte.code + (lbArte.files.length > 1 ? " · card " + (lbIdx+1) + "/" + lbArte.files.length : "");
    var multi = lbArte.files.length > 1;
    $("#lbPrev").style.visibility = multi ? "visible" : "hidden";
    $("#lbNext").style.visibility = multi ? "visible" : "hidden";
  }
  function fecharLb(){ $("#lb").classList.remove("on"); }
  $("#lbClose").addEventListener("click", fecharLb);
  $("#lb").addEventListener("click", function(e){ if(e.target === this) fecharLb(); });
  $("#lbPrev").addEventListener("click", function(){ lbIdx = (lbIdx - 1 + lbArte.files.length) % lbArte.files.length; pintarLb(); });
  $("#lbNext").addEventListener("click", function(){ lbIdx = (lbIdx + 1) % lbArte.files.length; pintarLb(); });
  document.addEventListener("keydown", function(e){
    if(!$("#lb").classList.contains("on")) return;
    if(e.key === "Escape") fecharLb();
    if(e.key === "ArrowLeft") $("#lbPrev").click();
    if(e.key === "ArrowRight") $("#lbNext").click();
  });

  // ---------- guarda local (rede de segurança) ----------
  function salvarLocal(){
    lsSet("mv_cg_status", JSON.stringify(status));
    lsSet("mv_cg_notas", JSON.stringify(notas));
  }
  function carregarLocal(){
    try{
      status = JSON.parse(lsGet("mv_cg_status") || "{}") || {};
      notas  = JSON.parse(lsGet("mv_cg_notas")  || "[]") || [];
    }catch(e){ status = {}; notas = []; }
  }

  /* O indicador só existe depois que um produto é escolhido — na tela de
     escolha não há cabeçalho. Guardar o estado e pintar quando houver onde
     evita o erro que matava o boot inteiro (e, com ele, a busca dos dados). */
  var estadoLive = {on:false, msg:"conectando"};

  function marcarLive(on, msg){
    estadoLive = {on:on, msg: msg || (on ? "ao vivo" : "só neste navegador")};
    pintarLive();
  }

  function pintarLive(){
    var el = $("#live");
    if(!el) return;
    el.className = "live " + (estadoLive.on ? "on" : "off");
    $("#liveTxt").textContent = estadoLive.msg;
    el.title = estadoLive.on
      ? "Status e anotações são compartilhados em tempo real."
      : estadoLive.msg;
  }

  // ---------- gravação ----------
  function gravarStatus(key, reg){
    enfileirar({tipo:"status", key:key, status:reg.status, em:reg.em, remessa:reg.remessa});
  }

  function gravarNota(nota){
    enfileirar({tipo:"nota", arteKey:nota.arteKey, remessa:nota.remessa,
                texto:nota.texto, criadoEm:nota.criadoEm});
  }

  // ---------- sincronismo com o servidor ----------
  /* Estado compartilhado mora numa função Netlify (Netlify Blobs).
     Busca a cada 4s, e logo depois de cada gravação.

     Nada que a pessoa escreve depende da rede dar certo na hora: a anotação
     entra numa fila guardada no próprio navegador, aparece na tela marcada
     como "enviando…", e só sai da fila quando o servidor confirma. Se a
     conexão cair, ou a pessoa atualizar a página no meio, a fila continua
     lá e é reenviada sozinha. */
  var API = "/api/estado";
  var ultimaSig = "";
  var notasServidor = [];
  var fila = [];          // anotações e decisões ainda não confirmadas
  var enviando = false;

  function carregarFila(){
    try{ fila = JSON.parse(lsGet("mv_cg_fila") || "[]") || []; }catch(e){ fila = []; }
  }
  function salvarFila(){ lsSet("mv_cg_fila", JSON.stringify(fila)); }

  /* junta o que veio do servidor com o que ainda está na fila */
  function recompor(){
    notas = notasServidor.concat(
      fila.filter(function(f){ return f.tipo === "nota"; }).map(function(f){
        return {id:f.id, arteKey:f.arteKey, remessa:f.remessa,
                texto:f.texto, criadoEm:f.criadoEm, pendente:true};
      })
    ).sort(function(a,b){ return String(a.criadoEm).localeCompare(String(b.criadoEm)); });

    fila.filter(function(f){ return f.tipo === "status"; }).forEach(function(f){
      status[f.key] = {status:f.status, em:f.em, remessa:f.remessa};
    });

    salvarLocal();
    renderAll();
  }

  function aplicar(estado){
    if(!estado || typeof estado !== "object") return;
    var sig = JSON.stringify(estado) + "|" + fila.length;
    if(sig === ultimaSig) return;        // nada mudou: não repinta
    ultimaSig = sig;
    status = estado.artes || {};
    notasServidor = estado.anotacoes || [];
    medicoes = estado.medicoes || {};      // notas do PageSpeed medidas sozinhas
    execucao = estado.execucao || null;
    recompor();
  }

  function buscar(){
    return fetch(API, {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(e){ marcarLive(true, fila.length ? "enviando pendentes" : null); aplicar(e); esvaziar(); })
      .catch(function(){ marcarLive(false, "sem conexão — nada foi perdido"); });
  }

  function mandar(payload){
    return fetch(API, {
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify(payload)
    })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(e){ marcarLive(true); aplicar(e); return true; })
      .catch(function(){ marcarLive(false, "sem conexão — nada foi perdido"); return false; });
  }

  /* envia a fila em ordem, um de cada vez; o que falhar fica para a próxima */
  function esvaziar(){
    if(enviando || !fila.length) return;
    enviando = true;
    var item = fila[0];
    var carga = item.tipo === "nota"
      ? {tipo:"nota", arteKey:item.arteKey, remessa:item.remessa, texto:item.texto, criadoEm:item.criadoEm}
      : {tipo:"status", key:item.key, status:item.status, em:item.em, remessa:item.remessa};

    mandar(carga).then(function(ok){
      enviando = false;
      if(!ok) return;                 // tenta de novo na próxima busca
      fila.shift(); salvarFila(); recompor();
      esvaziar();
    });
  }

  function enfileirar(item){
    item.id = "f-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
    fila.push(item); salvarFila(); recompor(); esvaziar();
  }

  // ---------- boot ----------
  carregarLocal();
  carregarFila();
  recompor();
  marcarLive(false, "conectando");
  buscar();

  setInterval(function(){ if(!document.hidden) buscar(); }, 4000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) buscar(); });
  window.addEventListener("online", buscar);

})();
</script>
</body>
